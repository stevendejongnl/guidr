---
# Namespace (optional - remove if using default namespace)
apiVersion: v1
kind: Namespace
metadata:
  name: guidr
  labels:
    name: guidr

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guidr-test-server
  namespace: guidr
  labels:
    app: guidr-test-server
    version: "1.5.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guidr-test-server
  template:
    metadata:
      labels:
        app: guidr-test-server
        version: "1.5.0"
    spec:
      containers:
      - name: test-server
        image: ghcr.io/stevendejongnl/guidr-test-server:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: GUIDR_VERSION
          value: "1.5.0"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: guidr-test-server
  namespace: guidr
  labels:
    app: guidr-test-server
spec:
  type: ClusterIP
  selector:
    app: guidr-test-server
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  sessionAffinity: None

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guidr-test-server
  namespace: guidr
  labels:
    app: guidr-test-server
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: guidr.madebysteven.nl
    http:
      paths:
      - path: /testing-server(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: guidr-test-server
            port:
              number: 80
