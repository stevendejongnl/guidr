version: '3.8'

services:
  test-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GUIDR_VERSION: ${GUIDR_VERSION:-0.1.0}
    container_name: guidr-test-server
    ports:
      - "8000:8000"
    environment:
      - GUIDR_VERSION=${GUIDR_VERSION:-0.1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
