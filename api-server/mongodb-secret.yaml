# Kubernetes Secret for MongoDB Connection and JWT Configuration
# This file is a TEMPLATE - DO NOT commit actual secrets to git
#
# To create the secret in your cluster:
# 1. Replace the placeholder values with actual secrets
# 2. Apply: kubectl apply -f mongodb-secret.yaml -n guidr
#
# To generate a secure JWT secret:
# python -c "import secrets; print(secrets.token_urlsafe(32))"
#
apiVersion: v1
kind: Secret
metadata:
  name: guidr-mongodb-secret
  namespace: guidr
type: Opaque
stringData:
  # MongoDB Atlas connection string (example)
  # Replace with your actual connection string
  mongodb-url: "mongodb+srv://username:password@cluster0.xxxxx.mongodb.net/guidr_test?retryWrites=true&w=majority"

  # JWT Secret Key (generate with: python -c "import secrets; print(secrets.token_urlsafe(32))")
  # IMPORTANT: Use a different secret for each environment (dev, staging, production)
  jwt-secret-key: "REPLACE-WITH-GENERATED-SECRET-MIN-32-CHARACTERS"
