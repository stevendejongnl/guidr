[project]
name = "guidr-api-server"
version = "1.94.2"
description = "API server for Guidr mobile app"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Guidr Team"}
]
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "pydantic[email]==2.13.4",
    "motor>=3.6.0",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=25.1.0",
    "pydantic-settings>=2.0.0",
    "dependency-injector>=4.41.0",
    "python-multipart>=0.0.27",
    "httpx>=0.28.1",
    "sentry-sdk[fastapi]>=2.0.0",
    "openai>=1.40.0",
    "cryptography>=46.0.6",
    "ecdsa>=0.19.2",
    "pyasn1>=0.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.14.10",
    "mypy>=1.9.0",
    "mongomock-motor>=0.0.36",
    "freezegun>=1.5.0",
    "types-python-jose>=3.3.0",
    "pip-audit>=2.8.0",
]

[project.scripts]
guidr-server = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.14.10",
    "mypy>=1.9.0",
    "mongomock-motor>=0.0.36",
    "freezegun>=1.5.0",
    "types-python-jose>=3.3.0",
    "pip-audit>=2.8.0",
    "testcontainers>=4.14.1",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
python_files = "*_test.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-report=lcov:coverage.lcov"
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 89

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "PLC0415", "ANN401"]
ignore = ["N818", "UP046"]

[tool.ruff.lint.per-file-ignores]
"src/infrastructure/persistence/mongodb/mappers/*.py" = ["ANN401"]
"src/domain/entities/audit_log.py" = ["ANN401"]
"src/application/dtos/audit_log_dtos.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "."
