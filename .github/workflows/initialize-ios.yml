name: Initialize iOS Directory

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write  # Allow pushing commits

jobs:
  initialize-ios:
    name: Initialize iOS Directory
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check if iOS directory already exists
        run: |
          if [ -d "ios" ]; then
            echo "iOS directory already exists. Exiting."
            exit 1
          fi

      - name: Create temporary React Native project
        run: |
          cd /tmp
          npx @react-native-community/cli@latest init GuidrTemp --skip-install --version 0.83.1

      - name: Copy iOS directory to project
        run: |
          cp -r /tmp/GuidrTemp/ios ./mobile/ios

      - name: Update bundle identifier and app name
        run: |
          # Rename directories first (before updating file contents)
          if [ -d "mobile/ios/GuidrTemp.xcodeproj" ]; then
            mv mobile/ios/GuidrTemp.xcodeproj mobile/ios/guidr.xcodeproj
          fi

          if [ -d "mobile/ios/GuidrTemp" ]; then
            mv mobile/ios/GuidrTemp mobile/ios/guidr
          fi

          if [ -d "mobile/ios/GuidrTempTests" ]; then
            mv mobile/ios/GuidrTempTests mobile/ios/guidrTests
          fi

          # Update bundle identifier from org.reactjs.native.example.GuidrTemp to com.guidr
          find mobile/ios -type f \( -name "*.pbxproj" -o -name "*.plist" -o -name "*.m" -o -name "*.h" -o -name "*.xcscheme" \) \
            -exec sed -i '' 's/org\.reactjs\.native\.example\.GuidrTemp/com.guidr/g' {} +

          # Replace GuidrTemp with guidr (lowercase for technical names) in project files
          find mobile/ios -type f \( -name "*.pbxproj" -o -name "*.xcscheme" \) \
            -exec sed -i '' 's/GuidrTemp/guidr/g' {} +

          # Replace GuidrTemp with Guidr (capitalized for display names)
          find mobile/ios -type f \( -name "*.plist" -o -name "*.m" -o -name "*.h" \) \
            -exec sed -i '' 's/GuidrTemp/Guidr/g' {} +

          # Update Podfile comprehensively
          if [ -f "mobile/ios/Podfile" ]; then
            sed -i '' 's/GuidrTemp/guidr/g' mobile/ios/Podfile
            sed -i '' "s/'GuidrTemp'/'guidr'/g" mobile/ios/Podfile
            sed -i '' 's/"GuidrTemp"/"guidr"/g' mobile/ios/Podfile

            # Show Podfile for debugging
            echo "=== Podfile contents after updates ==="
            cat mobile/ios/Podfile
            echo "=== End of Podfile ==="
          fi

      - name: Ensure scheme is shared
        run: |
          # Create xcshareddata directory
          mkdir -p mobile/ios/guidr.xcodeproj/xcshareddata/xcschemes

          # Find and rename scheme files
          find mobile/ios/guidr.xcodeproj -name "GuidrTemp.xcscheme" -type f | while read scheme; do
            dir=$(dirname "$scheme")
            mv "$scheme" "$dir/guidr.xcscheme"
          done

          # Copy any schemes to shared location
          if [ -d "mobile/ios/guidr.xcodeproj/xcuserdata" ]; then
            find mobile/ios/guidr.xcodeproj/xcuserdata -name "*.xcscheme" -type f -exec cp {} mobile/ios/guidr.xcodeproj/xcshareddata/xcschemes/ \;
          fi

          # List schemes for debugging
          echo "Available schemes:"
          xcodebuild -project mobile/ios/guidr.xcodeproj -list || echo "Could not list schemes"

          # List what we have in shared schemes
          echo "Shared schemes:"
          ls -la mobile/ios/guidr.xcodeproj/xcshareddata/xcschemes/ || echo "No shared schemes directory"

      - name: Install npm dependencies
        run: |
          echo "=== Installing npm dependencies ==="
          npm ci

      - name: Install CocoaPods dependencies
        run: |
          cd mobile/ios
          echo "=== Installing CocoaPods dependencies ==="
          echo "Current directory: $(pwd)"
          echo "Files in directory:"
          ls -la

          # Install pods with verbose output
          pod install --verbose || {
            echo "=== Pod install failed, showing diagnostic info ==="
            echo "Podfile.lock contents (if exists):"
            cat Podfile.lock || echo "No Podfile.lock found"
            exit 1
          }

      - name: Verify build works
        run: |
          cd mobile/ios
          xcodebuild \
            -workspace guidr.xcworkspace \
            -scheme guidr \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation)' \
            -derivedDataPath ./build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Commit and push iOS directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/ios/
          git commit -m "Initialize iOS native directory with React Native 0.83.1"
          git push
