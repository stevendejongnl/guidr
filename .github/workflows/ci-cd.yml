name: CI/CD

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --workspaces --include=dev
      - run: npm run mobile:lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --workspaces --include=dev
      - run: npm run mobile:test

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --workspaces --include=dev
      - run: npm run mobile:typecheck

  api-server-test:
    name: API Server Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server
    services:
      mongodb:
        image: mongo:latest
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add UV to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: api-server/.venv
          key: ${{ runner.os }}-uv-${{ hashFiles('api-server/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

  api-server-lint:
    name: API Server Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add UV to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: api-server/.venv
          key: ${{ runner.os }}-uv-${{ hashFiles('api-server/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src

  web-app-lint:
    name: Web App Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces --include=dev

      - name: Run ESLint
        run: npm run web:lint

      - name: Run TypeScript check
        run: npm run web:typecheck

  web-app-test:
    name: Web App Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces --include=dev

      - name: Run tests
        run: npm test --workspace=web-app

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --workspaces --include=dev

      - name: Create Sentry properties file
        run: |
          source .sentry/config.env

          cat > mobile/android/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=$SENTRY_ORG
          defaults.project=$SENTRY_PROJECT_MOBILE
          defaults.url=$SENTRY_URL
          EOF

          echo "✅ Created Android Sentry properties file"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          key: android-sdk-36-bt36-ndk27.1.12297006

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Setup workspace symlinks
        run: |
          node scripts/setup-sentry-symlink.js

      - name: Debug workspace symlinks
        run: |
          echo "=== Root node_modules @guidr ==="
          ls -la node_modules/@guidr/ || echo "Not found"

          echo ""
          echo "=== Mobile node_modules @guidr ==="
          ls -la mobile/node_modules/@guidr/ || echo "Not found"

          echo ""
          echo "=== Mobile node_modules symlinks ==="
          find mobile/node_modules -maxdepth 2 -type l -ls 2>/dev/null | head -20 || true

      - name: Build Android APK
        run: |
          chmod +x mobile/android/gradlew
          mobile/android/gradlew assembleDebug --no-daemon --stacktrace -p mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios-build:
    name: iOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces --include=dev

      - name: Install CocoaPods dependencies
        run: |
          cd mobile/ios
          pod install

      - name: Create Sentry properties file
        run: |
          source .sentry/config.env

          cat > mobile/ios/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=$SENTRY_ORG
          defaults.project=$SENTRY_PROJECT_MOBILE
          defaults.url=$SENTRY_URL
          EOF

          echo "✅ Created iOS Sentry properties file"

      - name: Build iOS app for simulator
        run: |
          cd mobile/ios
          xcodebuild \
            -workspace guidr.xcworkspace \
            -scheme guidr \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination generic/platform=iOS\ Simulator \
            -derivedDataPath ./build \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-ios
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/guidr.app
          retention-days: 7

  notify-pr-failure:
    name: Notify PR Check Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [lint, test, typecheck, api-server-test, api-server-lint, web-app-lint, web-app-test, android-build, ios-build]

    steps:
      - uses: actions/checkout@v4

      - name: Get failure details
        id: error_details
        run: |
          # Fetch logs from GitHub API and extract last lines of errors
          gh run view ${{ github.run_id }} --log-failed > /tmp/error.txt 2>&1 || echo "Failed to fetch logs" > /tmp/error.txt

          # Extract last 10 lines of error output
          ERROR=$(tail -20 /tmp/error.txt | head -10 | sed 's/"/\\"/g')
          echo "ERROR_MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$ERROR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Get failed step name from logs
          FAILED_STEP=$(grep -oE "##\\[error\\].*" /tmp/error.txt | head -1 | sed 's/##\[error\]//' | sed 's/^[ \t]*//' | cut -d' ' -f1-5)
          if [ -z "$FAILED_STEP" ]; then
            FAILED_STEP="PR Checks"
          fi
          echo "FAILED_STEP=$FAILED_STEP" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Send failure notification
        run: |
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type pr_check_failure \
            --branch "${{ github.head_ref }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --step "${{ steps.error_details.outputs.FAILED_STEP || 'PR Checks' }}" \
            --error "${{ steps.error_details.outputs.ERROR_MSG || 'Check logs for details' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
