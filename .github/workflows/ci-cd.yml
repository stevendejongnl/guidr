name: CI/CD

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    uses: ./.github/workflows/job-lint.yml

  test:
    uses: ./.github/workflows/job-test.yml

  typecheck:
    uses: ./.github/workflows/job-typecheck.yml

  android-build:
    uses: ./.github/workflows/job-android-build.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  ios-build:
    uses: ./.github/workflows/job-ios-build.yml
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
