name: Export Certificates (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-certs:
    name: Generate and Export Certificates
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      # Create API key file for xcodebuild authentication
      - name: Create App Store Connect API Key
        run: |
          mkdir -p ${{ github.workspace }}/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > "${{ github.workspace }}/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"

      # Build once to let Xcode create certificates automatically
      - name: Build iOS archive (creates certificates)
        run: |
          cd ios
          xcodebuild \
            -workspace guidr.xcworkspace \
            -scheme guidr \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/guidr.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ${{ github.workspace }}/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            archive
        continue-on-error: true

      # Export certificate from keychain
      - name: Export certificate from keychain
        run: |
          mkdir -p ${{ github.workspace }}/exported

          # Find the distribution certificate
          CERT_NAME=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Found certificate: $CERT_NAME"

          # Export as .p12 with password
          EXPORT_PASSWORD="temporary-export-password-12345"
          security export -k ~/Library/Keychains/login.keychain-db \
            -t identities \
            -f pkcs12 \
            -o ${{ github.workspace }}/exported/distribution.p12 \
            -P "$EXPORT_PASSWORD"

          echo "$EXPORT_PASSWORD" > ${{ github.workspace }}/exported/certificate-password.txt
          echo "✅ Certificate exported to distribution.p12"

      # Find and copy provisioning profile
      - name: Export provisioning profile
        run: |
          # Find the provisioning profile for com.guidr
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" -exec grep -l "com.guidr" {} \; | head -1)

          if [ -n "$PROFILE_PATH" ]; then
            cp "$PROFILE_PATH" ${{ github.workspace }}/exported/guidr.mobileprovision

            # Extract UUID
            UUID=$(grep -A 1 '<key>UUID</key>' "$PROFILE_PATH" | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
            echo "$UUID" > ${{ github.workspace }}/exported/profile-uuid.txt

            echo "✅ Provisioning profile exported"
            echo "Profile UUID: $UUID"
          else
            echo "❌ No provisioning profile found for com.guidr"
            exit 1
          fi

      # Create instructions file
      - name: Create instructions
        run: |
          cat > ${{ github.workspace }}/exported/INSTRUCTIONS.txt << 'EOF'
          📦 iOS Certificate Export - Instructions
          =========================================

          This artifact contains:
          1. distribution.p12 - Your iOS Distribution certificate
          2. guidr.mobileprovision - Your provisioning profile for com.guidr
          3. certificate-password.txt - Password for the .p12 file
          4. profile-uuid.txt - UUID of the provisioning profile

          Next Steps:
          -----------

          1. Download this artifact and extract it

          2. Convert certificate to base64:
             # macOS/Linux:
             base64 -i distribution.p12 | pbcopy  # or save to file

             # Windows (PowerShell):
             [Convert]::ToBase64String([IO.File]::ReadAllBytes("distribution.p12")) | Set-Clipboard

          3. Convert provisioning profile to base64:
             # macOS/Linux:
             base64 -i guidr.mobileprovision | pbcopy

             # Windows (PowerShell):
             [Convert]::ToBase64String([IO.File]::ReadAllBytes("guidr.mobileprovision")) | Set-Clipboard

          4. Add these as GitHub Secrets:
             Go to: https://github.com/${{ github.repository }}/settings/secrets/actions

             Add:
             - DISTRIBUTION_CERTIFICATE_BASE64 = <base64 from step 2>
             - DISTRIBUTION_CERTIFICATE_PASSWORD = <value from certificate-password.txt>
             - PROVISIONING_PROFILE_BASE64 = <base64 from step 3>
             - PROVISIONING_PROFILE_UUID = <value from profile-uuid.txt>

          5. Tell Claude to update the workflow to use these secrets

          6. Delete this temporary branch (temp-export-certificates)

          Security Note:
          --------------
          These files contain your signing credentials. Keep them secure and delete
          them from your computer after adding to GitHub Secrets.
          EOF

      # Upload everything as artifact
      - name: Upload certificate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-certificates
          path: ${{ github.workspace }}/exported/
          retention-days: 7

      - name: Success message
        run: |
          echo "✅ Certificates exported successfully!"
          echo ""
          echo "Download the 'ios-certificates' artifact from:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "Follow the instructions in INSTRUCTIONS.txt"
