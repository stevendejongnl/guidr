name: iOS Build Job

on:
  workflow_call:

jobs:
  ios-build:
    name: iOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS app for simulator
        run: |
          cd ios
          xcodebuild \
            -workspace guidr.xcworkspace \
            -scheme guidr \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-ios
          path: ios/build/Build/Products/Debug-iphonesimulator/guidr.app
          retention-days: 7
