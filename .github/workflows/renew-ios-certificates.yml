name: Renew iOS Certificates

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force regenerate certificates even if valid'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  renew-certificates:
    name: Renew iOS Certificates
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bypass Cloudflare for Gitea access
        uses: xiaotianxt/bypass-cloudflare-for-github-action@v2.1.0
        with:
          cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          cf_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          disable_bot_fight_mode: 'true'
          bfm_propagation_delay: 60

      - name: Configure git for Gitea access
        run: |
          git config --global http.sslVerify false
          git config --global http.connectTimeout 60
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 0
          echo "✅ Git configured for Gitea + Cloudflare access"

      - name: Configure git credentials for Gitea (fastlane match)
        run: |
          git config --global credential.helper store
          echo "https://stevendejong:${GITEA_TOKEN}@git.madebysteven.nl" >> ~/.git-credentials
          chmod 600 ~/.git-credentials
          echo "✅ Git credentials configured for fastlane match"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile

      - name: Renew iOS certificates via fastlane match
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          bundle install --retry=3

          # Force regenerate if requested, otherwise just generate new cert if needed
          if [ "${{ github.event.inputs.force_regenerate }}" == "true" ]; then
            cd ios && bundle exec fastlane generate_certificates force:true
          else
            cd ios && bundle exec fastlane generate_certificates
          fi

      - name: Notify certificate renewal success
        if: success()
        run: |
          chmod +x ../scripts/send-telegram-notification.sh
          ../scripts/send-telegram-notification.sh \
            --type testflight_success \
            --version "iOS Certificates" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        continue-on-error: true

      - name: Notify certificate renewal failure
        if: failure()
        run: |
          chmod +x ../scripts/send-telegram-notification.sh
          ../scripts/send-telegram-notification.sh \
            --type testflight_failure \
            --version "iOS Certificates" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --step "Renew iOS Certificates" \
            --error "Certificate renewal failed. Check logs for details."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        continue-on-error: true
