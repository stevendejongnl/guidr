name: Test Cloudflare SSH Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    name: Test Cloudflare Access SSH
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          echo "Installing cloudflared..."
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz -o cloudflared.tgz
          tar -xzf cloudflared.tgz
          sudo mv cloudflared /usr/local/bin/
          sudo chmod +x /usr/local/bin/cloudflared
          echo "Cloudflared version:"
          cloudflared --version

      - name: Setup SSH key
        run: |
          echo "Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "${{ secrets.MATCH_GIT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          chmod 700 ~/.ssh
          echo "✓ SSH key configured"

      - name: Configure SSH for Cloudflare Access
        run: |
          echo "Configuring SSH to use cloudflared..."
          cat > ~/.ssh/config <<EOF
          Host gitaccess.madebysteven.nl
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            IdentityFile ~/.ssh/id_rsa
          EOF
          chmod 600 ~/.ssh/config
          echo "✓ SSH config created"
          echo ""
          echo "SSH config contents:"
          cat ~/.ssh/config

      - name: Set Cloudflare Access credentials
        run: |
          echo "Setting Cloudflare Access credentials..."
          echo "CF_ACCESS_CLIENT_ID is set: ${{ secrets.CF_ACCESS_CLIENT_ID != '' }}"
          echo "CF_ACCESS_CLIENT_SECRET is set: ${{ secrets.CF_ACCESS_CLIENT_SECRET != '' }}"
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Test cloudflared direct connection
        run: |
          echo "Testing direct cloudflared connection..."
          /usr/local/bin/cloudflared access ssh --hostname gitaccess.madebysteven.nl echo "Direct cloudflared connection successful" || echo "Direct cloudflared test failed with exit code $?"
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Test SSH connection with verbose output
        run: |
          echo "Testing SSH connection with verbose output..."
          ssh -vvv -o "BatchMode yes" -o "ConnectTimeout 30" git@gitaccess.madebysteven.nl exit 2>&1 || echo "SSH test failed with exit code $?"
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Test git ls-remote
        run: |
          echo "Testing git ls-remote..."
          git ls-remote git@gitaccess.madebysteven.nl:stevendejong/guidr-certificates.git 2>&1 || echo "Git ls-remote failed with exit code $?"
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Test git clone
        run: |
          echo "Testing git clone..."
          git clone git@gitaccess.madebysteven.nl:stevendejong/guidr-certificates.git /tmp/test-clone 2>&1 || echo "Git clone failed with exit code $?"
          if [ -d /tmp/test-clone ]; then
            echo "✓ Clone successful!"
            ls -la /tmp/test-clone
          else
            echo "✗ Clone failed - directory not created"
          fi
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "Test Summary"
          echo "=========================================="
          echo "Check the logs above to see which tests passed/failed"
          echo ""
          echo "Common issues:"
          echo "  - 'websocket: bad handshake' = CF_ACCESS credentials invalid/expired"
          echo "  - 'Permission denied (publickey)' = SSH key not authorized on server"
          echo "  - 'Connection timeout' = Cloudflare Access policy blocking connection"
          echo "  - 'Connection refused' = SSH service not running or wrong port"
