name: Test Cloudflare SSH Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    name: Test Cloudflare Access SSH
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          echo "Installing cloudflared..."
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz -o cloudflared.tgz
          tar -xzf cloudflared.tgz
          sudo mv cloudflared /usr/local/bin/
          sudo chmod +x /usr/local/bin/cloudflared
          echo "Cloudflared version:"
          cloudflared --version

      - name: Setup SSH key
        run: |
          echo "Setting up SSH key..."
          mkdir -p ~/.ssh
          echo "${{ secrets.MATCH_GIT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          chmod 700 ~/.ssh
          echo "✓ SSH key configured"

      - name: Configure SSH for Cloudflare Access
        run: |
          echo "Configuring SSH to use cloudflared..."
          cat > ~/.ssh/config <<EOF
          Host gitaccess.madebysteven.nl
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            IdentityFile ~/.ssh/id_rsa
          EOF
          chmod 600 ~/.ssh/config
          echo "✓ SSH config created"
          echo ""
          echo "SSH config contents:"
          cat ~/.ssh/config

      - name: Set Cloudflare Access credentials
        run: |
          echo "Setting Cloudflare Access credentials..."
          echo "CF_ACCESS_CLIENT_ID is set: ${{ secrets.CF_ACCESS_CLIENT_ID != '' }}"
          echo "CF_ACCESS_CLIENT_SECRET is set: ${{ secrets.CF_ACCESS_CLIENT_SECRET != '' }}"
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Test cloudflared authentication
        run: |
          echo "Testing cloudflared can authenticate with Cloudflare Access..."
          echo "Note: cloudflared access ssh is designed as an SSH ProxyCommand, not for direct execution"
          echo "We'll test it through SSH in the next steps"
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "✓ Cloudflare Access credentials are set"
          else
            echo "✗ Cloudflare Access credentials are missing"
            exit 1
          fi
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Test SSH connection with verbose output
        continue-on-error: true
        run: |
          echo "Testing SSH connection with verbose output..."
          echo "This will show detailed connection info including ProxyCommand execution"
          echo ""
          ssh -vvv -o "BatchMode yes" -o "ConnectTimeout 30" git@gitaccess.madebysteven.nl exit 2>&1 | tee /tmp/ssh-test.log || true
          echo ""
          if grep -q "websocket: bad handshake" /tmp/ssh-test.log 2>/dev/null; then
            echo "✗ DETECTED: websocket bad handshake - Cloudflare Access authentication failed"
          fi
          if grep -q "Permission denied" /tmp/ssh-test.log 2>/dev/null; then
            echo "✗ DETECTED: Permission denied - SSH key not authorized"
          fi
          if grep -q "Connection timed out" /tmp/ssh-test.log 2>/dev/null; then
            echo "✗ DETECTED: Connection timeout - Cloudflare Access may be blocking"
          fi
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Test git ls-remote
        continue-on-error: true
        run: |
          echo "Testing git ls-remote..."
          if git ls-remote git@gitaccess.madebysteven.nl:stevendejong/guidr-certificates.git 2>&1; then
            echo "✓ Git ls-remote successful!"
          else
            echo "✗ Git ls-remote failed with exit code $?"
          fi
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Test git clone
        continue-on-error: true
        run: |
          echo "Testing git clone..."
          if git clone git@gitaccess.madebysteven.nl:stevendejong/guidr-certificates.git /tmp/test-clone 2>&1; then
            echo "✓ Clone successful!"
            ls -la /tmp/test-clone
          else
            echo "✗ Clone failed with exit code $?"
          fi
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "Test Summary"
          echo "=========================================="
          echo "Check the logs above to see which tests passed/failed"
          echo ""
          echo "Common issues:"
          echo "  - 'websocket: bad handshake' = CF_ACCESS credentials invalid/expired"
          echo "  - 'Permission denied (publickey)' = SSH key not authorized on server"
          echo "  - 'Connection timeout' = Cloudflare Access policy blocking connection"
          echo "  - 'Connection refused' = SSH service not running or wrong port"
