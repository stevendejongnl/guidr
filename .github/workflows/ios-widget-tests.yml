name: iOS Widget Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-widget-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-widget-tests:
    name: iOS Widget Tests
    runs-on: macos-15
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Run widget unit tests
        run: |
          cd mobile/ios
          xcodebuild test \
            -project guidr.xcodeproj \
            -scheme GuidrWidgetTests \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro" \
            -configuration Debug
