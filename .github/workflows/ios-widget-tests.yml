name: iOS Widget Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-widget-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-widget-tests:
    name: iOS Widget Tests
    runs-on: macos-15
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Run widget unit tests
        run: |
          cd mobile/ios
          SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone 16 Pro" | grep -v "Plus\|Max" | head -1 | grep -oE '\([A-F0-9-]{36}\)' | tr -d '()')
          if [ -z "$SIMULATOR_ID" ]; then
            SIMULATOR_ID=$(xcrun simctl list devices available | grep "iPhone 16" | grep -v "Plus\|Max" | head -1 | grep -oE '\([A-F0-9-]{36}\)' | tr -d '()')
          fi
          echo "Using simulator: $SIMULATOR_ID"
          xcodebuild test \
            -project guidr.xcodeproj \
            -scheme GuidrWidgetTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -configuration Debug
