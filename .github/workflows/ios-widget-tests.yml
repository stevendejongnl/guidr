name: iOS Widget Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-widget-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-widget-tests:
    name: iOS Widget Tests (${{ matrix.device }})
    runs-on: macos-26
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        device: ['iPhone 16e', 'iPhone 17 Pro', 'iPad Air 13-inch (M3)']
    steps:
      - uses: actions/checkout@v4

      - name: Run widget unit tests
        run: |
          cd mobile/ios
          xcodebuild test \
            -project guidr.xcodeproj \
            -scheme GuidrWidgetTests \
            -destination "platform=iOS Simulator,name=${{ matrix.device }}" \
            -configuration Debug
