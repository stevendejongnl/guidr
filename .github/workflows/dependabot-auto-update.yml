name: Dependabot Auto Update

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC nightly
  workflow_dispatch:        # manual trigger

concurrency:
  group: dependabot-auto-update
  cancel-in-progress: true

jobs:
  update-dependabot-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Process Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Fetching open Dependabot PRs..."

          gh pr list \
            --repo "$REPO" \
            --author "app/dependabot" \
            --state open \
            --json number,title,mergeStateStatus \
            --jq '.[] | "\(.number) \(.mergeStateStatus) \(.title)"' \
          | while read -r pr status title; do
              echo "PR #$pr [$status]: $title"
              if [[ "$status" == "DIRTY" ]]; then
                echo "  Skipping PR #$pr — merge conflict, needs manual resolution"
                continue
              fi
              if [[ "$status" != "BLOCKED" && "$status" != "BEHIND" && "$status" != "UNKNOWN" ]]; then
                echo "  Skipping PR #$pr — unexpected state: $status"
                continue
              fi
              echo "  Updating branch for PR #$pr..."
              gh pr update-branch "$pr" --repo "$REPO" || echo "  PR #$pr could not be updated (conflict?)"
              echo "  Approving PR #$pr..."
              gh pr review "$pr" --repo "$REPO" --approve --body "Auto-approved by nightly Dependabot merge job" || echo "  PR #$pr could not be approved"
              echo "  Enabling auto-merge for PR #$pr..."
              gh pr merge "$pr" --repo "$REPO" --auto --squash || echo "  PR #$pr auto-merge could not be enabled"
              sleep 10
            done

          echo "Done processing Dependabot PRs."
