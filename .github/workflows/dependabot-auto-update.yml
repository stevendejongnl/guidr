name: Dependabot Auto Update

on:
  push:
    branches:
      - main

concurrency:
  group: dependabot-auto-update
  cancel-in-progress: true

jobs:
  update-dependabot-prs:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update behind Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Wait for GitHub to compute merge states after the push
          sleep 15

          gh pr list \
            --repo "$REPO" \
            --author "app/dependabot" \
            --state open \
            --json number,mergeStateStatus \
            --jq '.[] | select(.mergeStateStatus == "BEHIND" or .mergeStateStatus == "UNKNOWN") | .number' \
          | while read -r pr; do
              echo "Updating PR #$pr"
              gh pr update-branch "$pr" --repo "$REPO" || echo "PR #$pr could not be updated (conflict?)"
            done
