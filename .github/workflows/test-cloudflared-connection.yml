name: Test Cloudflared Connection
run-name: "Test Cloudflared Connection - ${{ github.actor }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cloudflared:
    name: Test Cloudflared Connectivity
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared jammy main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update
          sudo apt-get install -y cloudflared
          cloudflared --version
          echo "✅ cloudflared installed"

      - name: Test cloudflared access authentication
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "Step 1: Check if credentials are loaded"
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "❌ Credentials not loaded"
            exit 1
          fi
          echo "✅ Credentials loaded"
          echo "   Client ID: ${CF_ACCESS_CLIENT_ID:0:20}..."
          echo ""

          echo "Step 2: Export credentials for cloudflared"
          export CF_ACCESS_CLIENT_ID
          export CF_ACCESS_CLIENT_SECRET
          echo "✅ Credentials exported"
          echo ""

          echo "Step 3: Test cloudflared access to gitaccess.madebysteven.nl"
          echo "Running: cloudflared access ssh --hostname gitaccess.madebysteven.nl"
          echo ""

          # Try to connect - this will attempt to establish the tunnel
          # We expect it to either succeed or fail with a specific error
          timeout 10 cloudflared access ssh --hostname gitaccess.madebysteven.nl < /dev/null 2>&1 | tee /tmp/cloudflared_test.log || true

          echo ""
          echo "=========================================="
          echo "Cloudflared Test Results"
          echo "=========================================="
          cat /tmp/cloudflared_test.log
          echo ""

          # Check for authentication success/failure
          if grep -qi "authentication" /tmp/cloudflared_test.log; then
            if grep -qi "failed\|denied\|unauthorized" /tmp/cloudflared_test.log; then
              echo "❌ Cloudflare Access authentication FAILED"
              exit 1
            else
              echo "✅ Cloudflare Access authentication appears successful"
            fi
          else
            echo "⚠️ No clear authentication message - check output above"
          fi

      - name: Test raw TCP connection through cloudflared
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "Testing if we can establish TCP connection to Gitea SSH port..."
          export CF_ACCESS_CLIENT_ID
          export CF_ACCESS_CLIENT_SECRET

          # Try to get SSH banner through cloudflared
          timeout 10 sh -c 'cloudflared access ssh --hostname gitaccess.madebysteven.nl 2>&1 &
          CLOUDFLARED_PID=$!
          sleep 3
          echo "SSH-2.0-Test" | nc localhost 22 2>&1 || true
          kill $CLOUDFLARED_PID 2>/dev/null || true' | tee /tmp/tcp_test.log || true

          echo ""
          echo "TCP connection test output:"
          cat /tmp/tcp_test.log

          if grep -q "SSH-" /tmp/tcp_test.log; then
            echo ""
            echo "✅ Received SSH banner - connection works!"
          else
            echo ""
            echo "⚠️ No SSH banner received"
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "Test Summary"
          echo "=========================================="
          echo ""
          echo "This test verifies:"
          echo "1. ✓ Cloudflared installation"
          echo "2. ✓ Cloudflare Access credentials loading"
          echo "3. ✓ Cloudflared authentication with Cloudflare Access"
          echo "4. ✓ TCP connectivity to Gitea server through tunnel"
          echo ""
          echo "If all steps passed, the SSH connection should work."
          echo "If any step failed, check the logs above for details."
