name: TestFlight Deployment

on:
  # Trigger after Release workflow completes successfully
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      skip_testflight:
        description: 'Skip TestFlight upload (build only)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  testflight-build:
    name: Build and Deploy to TestFlight
    runs-on: macos-15
    # Only run if manual trigger OR Release workflow succeeded
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch tags and checkout latest
        if: github.event_name == 'workflow_run'
        id: checkout_tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0)

          # Check if tag was created in the last 5 minutes (indicates new release)
          TAG_DATE=$(git log -1 --format=%ct $LATEST_TAG)
          CURRENT_DATE=$(date +%s)
          AGE=$((CURRENT_DATE - TAG_DATE))

          if [ $AGE -gt 300 ]; then
            echo "Latest tag $LATEST_TAG is $AGE seconds old - no new release created"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git checkout $LATEST_TAG
          echo "Checked out tag: $LATEST_TAG (created $AGE seconds ago)"
          echo "should_build=true" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: npm ci

      - name: Install CocoaPods dependencies
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          cd ios
          pod install

      - name: Setup Ruby and Bundler
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true  # Automatically runs bundle install and caches gems

      # Create API key file from secret
      - name: Create App Store Connect API Key
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      # Auto-increment build number with timestamp
      - name: Increment build number
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          BUILD_NUM=$(date +%Y%m%d%H%M%S)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/guidr/Info.plist
          echo "Build number set to: $BUILD_NUM"
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_ENV

      # Build archive with signing
      - name: Build iOS archive
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          cd ios
          xcodebuild \
            -workspace guidr.xcworkspace \
            -scheme guidr \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/guidr.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            archive

      # Export signed IPA
      - name: Export IPA
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          cd ios
          xcodebuild \
            -exportArchive \
            -archivePath ./build/guidr.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ./ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      # Get version info
      - name: Get version information
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        id: version
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IPA_PATH=$(pwd)/ios/build/guidr.ipa" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      # Upload to TestFlight with Fastlane pilot
      - name: Upload to TestFlight and assign to group
        if: |
          (github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true') &&
          github.event.inputs.skip_testflight != 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
        run: |
          bundle exec fastlane pilot upload \
            --api_key_path "$APP_STORE_CONNECT_API_KEY_PATH" \
            --ipa "${{ steps.version.outputs.IPA_PATH }}" \
            --skip_waiting_for_build_processing true \
            --distribute_external false \
            --groups "main" \
            --changelog "Automated build from CI/CD pipeline"

      # Upload IPA as artifact (for debugging/archiving)
      - name: Upload IPA artifact
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guidr-testflight-v${{ steps.version.outputs.VERSION }}-build${{ env.BUILD_NUMBER }}
          path: ios/build/guidr.ipa
          retention-days: 30

      # Cleanup API key
      - name: Cleanup API key
        if: always() && (github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true')
        run: rm -f ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
