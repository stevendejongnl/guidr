name: TestFlight Deployment
run-name: "TestFlight Deployment ${{ github.event.client_payload.version || '' }}"

on:
  # Trigger when a new release is created
  repository_dispatch:
    types: [release-created]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      skip_testflight:
        description: 'Skip TestFlight upload (build only)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  testflight-build:
    name: Build and Deploy to TestFlight
    runs-on: macos-26
    # Only run if manual trigger or release-created event
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    # Serialize Cloudflare bypass operations to avoid rate limiting
    concurrency:
      group: cloudflare-bypass
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: |
          echo "🔍 Checking Xcode version on macos-26 runner..."
          xcodebuild -version
          echo ""
          echo "🔍 Checking iOS SDK versions available..."
          xcodebuild -showsdks | grep iphoneos
          echo ""
          echo "✅ Expected: Xcode 26.x with iOS 26 SDK (or Xcode 16.x as fallback)"

      - name: Bypass Cloudflare for Gitea access
        uses: xiaotianxt/bypass-cloudflare-for-github-action@v2.1.0
        with:
          cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          cf_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          disable_bot_fight_mode: 'true'
          bfm_propagation_delay: 30

      - name: Configure git for Gitea access
        run: |
          # Disable SSL verification for Gitea behind Cloudflare (using bypass)
          git config --global http.sslVerify false
          # Increase connection timeout for Gitea clone
          git config --global http.connectTimeout 60
          # Disable low-speed timeout that could kill slow clones
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 0
          echo "✅ Git configured for Gitea + Cloudflare access"

      - name: Configure git credentials for Gitea (fastlane match)
        run: |
          # Set up git credential helper to store Gitea credentials
          git config --global credential.helper store

          # Add Gitea credentials to git credential store
          # Format: https://username:token@host
          echo "https://stevendejong:${GITEA_TOKEN}@git.madebysteven.nl" >> ~/.git-credentials

          # Restrict permissions on credentials file
          chmod 600 ~/.git-credentials

          echo "✅ Git credentials configured for fastlane match"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

      - name: Get version
        id: version_check
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            # Manual trigger: extract from package.json
            VERSION=$(grep '"version"' mobile/package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: npm ci --workspaces --include=dev
        # IMPORTANT: --workspaces flag installs all workspace packages (@guidr/shared, mobile, web-app)
        # --include=dev ensures devDependencies like @react-native/metro-config are installed
        # Without this, Metro bundler cannot resolve @guidr/shared or @react-native/metro-config during xcodebuild,
        # causing "main.jsbundle.map not found" or "Cannot resolve @react-native/metro-config" errors
        # See: docs/CI_CD_TROUBLESHOOTING.md#issue-testflight-build-fails-with-missing-source-map

      - name: Build shared package
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: npm run build:shared

      - name: Create mobile .env file with Sentry DSN
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          cat > mobile/.env <<EOF
          SENTRY_DSN=${{ secrets.MOBILE_SENTRY_DSN }}
          EOF

          echo "✅ Created mobile .env file with Sentry configuration"

      - name: Restore CocoaPods cache
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          cd mobile/ios
          # Install dependencies from cache (skip repo update to avoid 10-20min delay)
          pod install

      - name: Check for Vendored Frameworks
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          cd mobile/ios/Pods

          echo "🔍 Checking for .framework files in Pods..."
          FRAMEWORK_COUNT=$(find . -name "*.framework" -type d 2>/dev/null | wc -l)
          echo "  Found $FRAMEWORK_COUNT .framework directories"

          if [ $FRAMEWORK_COUNT -gt 0 ]; then
            echo "  Frameworks:"
            find . -name "*.framework" -type d 2>/dev/null | head -20
          else
            echo "  No frameworks found"
          fi

          echo ""
          echo "🔍 Checking xcfilelist for frameworks to embed..."
          if [ -f "Target Support Files/Pods-guidr/Pods-guidr-frameworks-Release-input-files.xcfilelist" ]; then
            echo "  📋 Input files for embedding:"
            cat "Target Support Files/Pods-guidr/Pods-guidr-frameworks-Release-input-files.xcfilelist" | head -10
            FILELIST_SIZE=$(wc -l < "Target Support Files/Pods-guidr/Pods-guidr-frameworks-Release-input-files.xcfilelist")
            echo "  Total lines in filelist: $FILELIST_SIZE"
          else
            echo "  ℹ️ No input filelist found - no frameworks to embed"
          fi

      - name: Verify and Remove CocoaPods Build System File Lists
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          cd mobile/ios

          echo "📋 Checking for file lists BEFORE removal..."
          INPUT_COUNT=$(grep -c "inputFileListPaths" guidr.xcodeproj/project.pbxproj || echo "0")
          OUTPUT_COUNT=$(grep -c "outputFileListPaths" guidr.xcodeproj/project.pbxproj || echo "0")
          echo "  Found $INPUT_COUNT inputFileListPaths entries"
          echo "  Found $OUTPUT_COUNT outputFileListPaths entries"

          echo "🔧 Removing file lists..."
          # macOS/BSD sed requires -i '' syntax
          sed -i '' '/inputFileListPaths = (/,/);$/d' guidr.xcodeproj/project.pbxproj
          sed -i '' '/outputFileListPaths = (/,/);$/d' guidr.xcodeproj/project.pbxproj

          echo "✅ Checking for file lists AFTER removal..."
          if grep -q "inputFileListPaths" guidr.xcodeproj/project.pbxproj || grep -q "outputFileListPaths" guidr.xcodeproj/project.pbxproj; then
            echo "❌ ERROR: File lists still present after sed removal!"
            echo "Remaining inputFileListPaths entries:"
            grep -A 3 "inputFileListPaths" guidr.xcodeproj/project.pbxproj || echo "  (none)"
            echo "Remaining outputFileListPaths entries:"
            grep -A 3 "outputFileListPaths" guidr.xcodeproj/project.pbxproj || echo "  (none)"
            exit 1
          else
            echo "✅ File lists successfully removed - no entries remaining"
          fi

      - name: Setup Ruby and Bundler
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true  # Automatically runs bundle install and caches gems
          working-directory: mobile

      # DISABLED: DerivedData caching can cause stale keychain references
      # - name: Restore Xcode DerivedData cache
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/Library/Developer/Xcode/DerivedData
      #     key: ${{ runner.os }}-xcode-derived-data-${{ hashFiles('mobile/ios/Podfile.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-xcode-derived-data-

      - name: Verify keychain setup
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          echo "📋 Keychain configuration:"
          security list-keychains
          echo ""
          echo "📋 Available signing identities:"
          security find-identity -v -p codesigning

      # Create API key files from secrets
      - name: Create App Store Connect API Key
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          mkdir -p $HOME/private_keys

          # Create .p8 file for xcodebuild
          P8_PATH="$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > "$P8_PATH"

          # Create JSON file for Fastlane pilot with embedded key content
          JSON_PATH="$HOME/private_keys/api_key.json"
          jq -n \
            --arg key_id "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --arg issuer_id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --arg key "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' > "$JSON_PATH"

          echo "APP_STORE_CONNECT_API_KEY_JSON_PATH=$JSON_PATH" >> $GITHUB_ENV

      - name: Create temporary keychain for code signing
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="temp_password_$(uuidgen)"

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Set keychain timeout (2 hours = 7200 seconds)
          security set-keychain-settings -t 7200 -u "$KEYCHAIN_PATH"

          # Unlock keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list (prepend so it's found first)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          # Export for fastlane match
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          echo "✅ Temporary keychain created at $KEYCHAIN_PATH"

      - name: Sync code signing with fastlane match
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        working-directory: mobile/ios
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_STORE_CONNECT_API_KEY_JSON_PATH: ${{ env.APP_STORE_CONNECT_API_KEY_JSON_PATH }}
          MATCH_KEYCHAIN_NAME: ${{ env.KEYCHAIN_PATH }}
          MATCH_KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
        run: |
          # Gems are already installed by ruby/setup-ruby action with bundler-cache
          # Run fastlane from mobile/ios directory
          bundle exec fastlane sync_certificates

      - name: Create Sentry properties file
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          cat > mobile/ios/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=madebysteven
          defaults.project=guidr
          defaults.url=https://sentry.io/
          EOF

          echo "✅ Created iOS Sentry properties file"

      # Auto-increment build number with timestamp
      - name: Increment build number
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          BUILD_NUM=$(date +%Y%m%d%H%M%S)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" mobile/ios/guidr/Info.plist
          echo "Build number set to: $BUILD_NUM"
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_ENV

      - name: Install GNU coreutils for timeout command
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          brew install coreutils
          echo "✅ GNU coreutils installed"

      # Build archive with manual signing via fastlane match
      - name: Build iOS archive
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        timeout-minutes: 60
        env:
          SENTRY_DISABLE_XCODE_DEBUG_UPLOAD: true
          SENTRY_ALLOW_FAILURE: true
        run: |
          cd mobile/ios
          echo "ℹ️ Starting iOS archive build (Sentry upload disabled)..."
          BUILD_START=$(date +%s)

          # Run xcodebuild with timeout (45 minutes = 2700 seconds)
          # Use gtimeout from coreutils (GNU timeout for macOS)
          gtimeout 2700 xcodebuild \
            -workspace guidr.xcworkspace \
            -scheme guidr \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/guidr.xcarchive \
            -hideShellScriptEnvironment \
            ONLY_ACTIVE_ARCH=NO \
            VALIDATE_WORKSPACE=NO \
            DISABLE_MANUAL_TARGET_ORDER_BUILD_WARNING=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="match AppStore com.guidr" \
            archive 2>&1 | tee build.log

          BUILD_STATUS=$?
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))

          if [ $BUILD_STATUS -eq 124 ]; then
            echo "❌ Build timed out after 45 minutes"
            tail -100 build.log
            exit 1
          elif [ $BUILD_STATUS -ne 0 ]; then
            echo "❌ Build failed after $((BUILD_DURATION / 60))m $((BUILD_DURATION % 60))s"
            tail -100 build.log
            exit $BUILD_STATUS
          fi

          echo "✅ Build completed in $((BUILD_DURATION / 60))m $((BUILD_DURATION % 60))s"

          # Verify archive was created
          if [ ! -d "./build/guidr.xcarchive" ]; then
            echo "❌ Archive not found at ./build/guidr.xcarchive"
            exit 1
          fi

      # Upload debug symbols to Sentry after successful build
      - name: Upload debug symbols to Sentry
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        continue-on-error: true
        run: |
          cd mobile/ios

          # Extract dSYM from archive
          DSYM_PATH="./build/guidr.xcarchive/dSYMs/guidr.app.dSYM"

          if [ ! -d "$DSYM_PATH" ]; then
            echo "⚠️ Warning: dSYM not found at $DSYM_PATH"
            exit 0
          fi

          echo "📤 Uploading debug symbols to Sentry..."

          # Upload using sentry-cli
          npx @sentry/cli debug-files upload \
            --auth-token "${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --org madebysteven \
            --project guidr \
            "$DSYM_PATH"

          echo "✅ Debug symbols uploaded to Sentry"

      # Export signed IPA
      - name: Export IPA
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: |
          cd mobile/ios
          xcodebuild \
            -exportArchive \
            -archivePath ./build/guidr.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ./ExportOptions.plist

      # Get version info
      - name: Get version information
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        id: version
        run: |
          VERSION=$(grep '"version"' mobile/package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IPA_PATH=$(pwd)/mobile/ios/build/guidr.ipa" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      # Extract changelog for TestFlight "What to Test" notes
      - name: Generate TestFlight changelog
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          BUILD_NUM="${{ env.BUILD_NUMBER }}"

          # Extract the latest version's changelog section from CHANGELOG.md (at root)
          if [ -f "../CHANGELOG.md" ]; then
            # Get content for the current version (between ## [version] and next ## [)
            CHANGELOG_TEXT=$(awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' ../CHANGELOG.md)

            # If no exact version match, get the latest section
            if [ -z "$CHANGELOG_TEXT" ]; then
              CHANGELOG_TEXT=$(awk '/^## \[/{if(found) exit; found=1; next} found' ../CHANGELOG.md)
            fi

            # Convert markdown to plain text for TestFlight (doesn't support markdown)
            CHANGELOG_TEXT=$(echo "$CHANGELOG_TEXT" | \
              sed 's/^### //' | \
              sed 's/^## //' | \
              sed 's/^# //' | \
              sed 's/^\* /• /' | \
              sed 's/^- /• /' | \
              sed 's/\*\*\([^*]*\)\*\*/\1/g' | \
              sed 's/__\([^_]*\)__/\1/g' | \
              sed 's/\*\([^*]*\)\*/\1/g' | \
              sed 's/_\([^_]*\)_/\1/g' | \
              sed 's/`\([^`]*\)`/\1/g' | \
              sed 's/\[([^]]*)\]([^)]*)/\1/g' | \
              sed '/^$/d' | \
              head -c 3900)

            if [ -z "$CHANGELOG_TEXT" ]; then
              CHANGELOG_TEXT="Please test the latest features and report any issues."
            fi
          else
            CHANGELOG_TEXT="Please test the latest features and report any issues."
          fi

          # Build the changelog file with proper formatting
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            {
              echo "🧪 Manual Test Build - v${VERSION} (Build ${BUILD_NUM})"
              echo ""
              echo "$CHANGELOG_TEXT"
              echo ""
              echo "---"
              echo "This is a manual test build from the CI/CD pipeline."
            } > /tmp/changelog.txt
          else
            {
              echo "🚀 New Release - v${VERSION}"
              echo ""
              echo "$CHANGELOG_TEXT"
            } > /tmp/changelog.txt
          fi

          echo "CHANGELOG_FILE=/tmp/changelog.txt" >> $GITHUB_ENV

          # Output for logging
          echo "=== TestFlight What to Test ==="
          cat /tmp/changelog.txt
          echo "==============================="

      # Upload to TestFlight using Fastlane pilot (supports changelog for "What to Test")
      - name: Upload to TestFlight
        if: |
          (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') &&
          github.event.inputs.skip_testflight != 'true'
        working-directory: mobile
        run: |
          # Read changelog from file
          CHANGELOG_TEXT=$(cat "${{ env.CHANGELOG_FILE }}")

          bundle exec fastlane pilot upload \
            --ipa "${{ steps.version.outputs.IPA_PATH }}" \
            --api_key_path "${{ env.APP_STORE_CONNECT_API_KEY_JSON_PATH }}" \
            --skip_waiting_for_build_processing true \
            --changelog "$CHANGELOG_TEXT" \
            --distribute_external false

      # Upload IPA as artifact (for debugging/archiving)
      - name: Upload IPA artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: guidr-testflight-v${{ steps.version.outputs.VERSION }}-build${{ env.BUILD_NUMBER }}
          path: mobile/ios/build/guidr.ipa
          retention-days: 30

      - name: Upload build log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-build-log-${{ env.BUILD_NUMBER }}
          path: mobile/ios/build.log
          retention-days: 7

      - name: Notify TestFlight success
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        working-directory: .
        run: |
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type testflight_success \
            --version "${{ steps.version.outputs.VERSION }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Get failure details
        if: failure()
        id: error_details
        run: |
          # Extract version from package.json (don't rely on previous step)
          VERSION=$(grep '"version"' mobile/package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/' || echo "unknown")

          # Get build log if it exists, otherwise use generic error
          if [ -f "mobile/ios/build.log" ]; then
            ERROR=$(tail -50 mobile/ios/build.log | grep -E "(error|Error|ERROR|failed|Failed|FAILED)" | head -5 | sed 's/"/\\"/g' || echo "Build failed - check logs")
          else
            ERROR="Build failed before log file was created"
          fi

          echo "ERROR_MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$ERROR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Determine failed step based on log content
          if [ -f "mobile/ios/build.log" ]; then
            if grep -q "codesign" mobile/ios/build.log; then
              FAILED_STEP="Build iOS archive (code signing)"
            elif grep -q "xcodebuild" mobile/ios/build.log; then
              FAILED_STEP="Build iOS archive (xcodebuild)"
            else
              FAILED_STEP="Build iOS archive"
            fi
          else
            FAILED_STEP="Build and Deploy to TestFlight"
          fi
          echo "FAILED_STEP=$FAILED_STEP" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Notify TestFlight failure
        if: failure()
        working-directory: .
        run: |
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type testflight_failure \
            --version "${{ steps.version.outputs.VERSION }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --step "${{ steps.error_details.outputs.FAILED_STEP || 'Build and Deploy to TestFlight' }}" \
            --error "${{ steps.error_details.outputs.ERROR_MSG || 'Check logs for details' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Cleanup signing keychain
      - name: Cleanup signing keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
            echo "✅ Temporary keychain cleaned up"
          fi

      # Cleanup API key files
      - name: Cleanup API key
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: |
          rm -f $HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          rm -f $HOME/private_keys/api_key.json
