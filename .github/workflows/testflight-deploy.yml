name: TestFlight Deployment

on:
  # Trigger after Release workflow completes successfully
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      skip_testflight:
        description: 'Skip TestFlight upload (build only)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  testflight-build:
    name: Build and Deploy to TestFlight
    runs-on: macos-15
    # Only run if manual trigger OR Release workflow succeeded
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch tags and checkout latest
        if: github.event_name == 'workflow_run'
        id: checkout_tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0)

          # Check if tag was created in the last 5 minutes (indicates new release)
          TAG_DATE=$(git log -1 --format=%ct $LATEST_TAG)
          CURRENT_DATE=$(date +%s)
          AGE=$((CURRENT_DATE - TAG_DATE))

          if [ $AGE -gt 300 ]; then
            echo "Latest tag $LATEST_TAG is $AGE seconds old - no new release created"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git checkout $LATEST_TAG
          echo "Checked out tag: $LATEST_TAG (created $AGE seconds ago)"
          echo "should_build=true" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: npm ci

      - name: Install CocoaPods dependencies
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          cd ios
          pod install

      - name: Setup Ruby and Bundler
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true  # Automatically runs bundle install and caches gems

      # Create API key files from secrets
      - name: Create App Store Connect API Key
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          mkdir -p $HOME/private_keys

          # Create .p8 file for xcodebuild
          P8_PATH="$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > "$P8_PATH"

          # Create JSON file for Fastlane pilot
          JSON_PATH="$HOME/private_keys/api_key.json"
          cat > "$JSON_PATH" << EOF
          {
            "key_id": "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}",
            "issuer_id": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
            "key_filepath": "$P8_PATH"
          }
          EOF

          echo "APP_STORE_CONNECT_API_KEY_JSON_PATH=$JSON_PATH" >> $GITHUB_ENV

          # Export API key environment variables for Fastlane Match
          echo "APP_STORE_CONNECT_API_KEY_PATH=$P8_PATH" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_KEY_ID=${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_ISSUER_ID=${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" >> $GITHUB_ENV

      # Install cloudflared for Cloudflare Access SSH tunneling
      - name: Install cloudflared
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          # Download and install cloudflared for macOS (GitHub Actions runner)
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-amd64.tgz -o cloudflared.tgz
          tar -xzf cloudflared.tgz
          sudo mv cloudflared /usr/local/bin/
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      # Setup SSH for Fastlane Match with Cloudflare Access
      - name: Setup SSH for Fastlane Match
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MATCH_GIT_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          chmod 700 ~/.ssh

          # Configure SSH to use cloudflared for Cloudflare Access
          cat > ~/.ssh/config <<EOF
          Host gitaccess.madebysteven.nl
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

          # Set up Cloudflare Access authentication
          export CF_ACCESS_CLIENT_ID="${{ secrets.CF_ACCESS_CLIENT_ID }}"
          export CF_ACCESS_CLIENT_SECRET="${{ secrets.CF_ACCESS_CLIENT_SECRET }}"

          echo "SSH configured for Cloudflare Access tunnel"

      # Populate SSH known_hosts for Cloudflare Access tunnel
      - name: Populate SSH known_hosts
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          # Use cloudflared ProxyCommand to scan host key through the tunnel
          ssh-keyscan -H gitaccess.madebysteven.nl >> ~/.ssh/known_hosts 2>/dev/null || true

          # Verify known_hosts was populated
          if [ -s ~/.ssh/known_hosts ]; then
            echo "SSH known_hosts populated successfully"
            cat ~/.ssh/known_hosts
          else
            echo "Warning: ssh-keyscan did not populate known_hosts"
            echo "Falling back to StrictHostKeyChecking accept-new"
          fi
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # Download/create certificates with Fastlane Match
      - name: Setup certificates with Fastlane Match
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          cd ios
          bundle exec fastlane match appstore --readonly
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # Auto-increment build number with timestamp
      - name: Increment build number
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          BUILD_NUM=$(date +%Y%m%d%H%M%S)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/guidr/Info.plist
          echo "Build number set to: $BUILD_NUM"
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_ENV

      # Build archive with signing (using Match certificates)
      - name: Build iOS archive
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          cd ios
          xcodebuild \
            -workspace guidr.xcworkspace \
            -scheme guidr \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/guidr.xcarchive \
            archive

      # Export signed IPA (using Match certificates)
      - name: Export IPA
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        run: |
          cd ios
          xcodebuild \
            -exportArchive \
            -archivePath ./build/guidr.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ./ExportOptions.plist

      # Get version info
      - name: Get version information
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        id: version
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IPA_PATH=$(pwd)/ios/build/guidr.ipa" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      # Upload to TestFlight with Fastlane pilot
      - name: Upload to TestFlight and assign to group
        if: |
          (github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true') &&
          github.event.inputs.skip_testflight != 'true'
        run: |
          bundle exec fastlane pilot upload \
            --api-key-path "$APP_STORE_CONNECT_API_KEY_JSON_PATH" \
            --ipa "${{ steps.version.outputs.IPA_PATH }}" \
            --skip_waiting_for_build_processing true \
            --distribute_external false \
            --groups "main" \
            --changelog "Automated build from CI/CD pipeline"

      # Upload IPA as artifact (for debugging/archiving)
      - name: Upload IPA artifact
        if: github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guidr-testflight-v${{ steps.version.outputs.VERSION }}-build${{ env.BUILD_NUMBER }}
          path: ios/build/guidr.ipa
          retention-days: 30

      # Cleanup API key files
      - name: Cleanup API key
        if: always() && (github.event_name == 'workflow_dispatch' || steps.checkout_tag.outputs.should_build == 'true')
        run: |
          rm -f $HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          rm -f $HOME/private_keys/api_key.json
