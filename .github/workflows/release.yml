name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

# Cancel any in-progress release run on main when a new commit is pushed.
# Prevents a stale run from tagging/releasing after a newer commit has landed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Wait for iOS Widget Tests
        if: github.event_name == 'push'
        uses: fountainhead/action-wait-for-check@v1.2.0
        id: widget-tests
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: 'iOS Widget Tests'
          ref: ${{ github.sha }}
          timeoutSeconds: 600
          intervalSeconds: 15

      - name: Fail if widget tests failed
        if: github.event_name == 'push' && steps.widget-tests.outputs.conclusion != 'success'
        run: |
          echo "::error::iOS Widget Tests did not pass (status: ${{ steps.widget-tests.outputs.conclusion }})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Create Sentry properties files
        run: |
          source .sentry/config.env

          cat > mobile/android/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=$SENTRY_ORG
          defaults.project=$SENTRY_PROJECT_MOBILE
          defaults.url=$SENTRY_URL
          EOF
          sed -i "s/^[[:space:]]*//" mobile/android/sentry.properties

          cat > mobile/ios/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=$SENTRY_ORG
          defaults.project=$SENTRY_PROJECT_MOBILE
          defaults.url=$SENTRY_URL
          EOF
          sed -i "s/^[[:space:]]*//" mobile/ios/sentry.properties

          echo "✅ Created Sentry properties files for Android and iOS"

      - name: Setup Java for Android builds
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Gradle repositories
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/repositories.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      google()
                      maven { url 'https://dl.google.com/android/maven2/' }
                      mavenCentral()
                      maven { url 'https://repo1.maven.org/maven2/' }
                  }
              }
              repositories {
                  google()
                  maven { url 'https://dl.google.com/android/maven2/' }
                  mavenCentral()
                  maven { url 'https://repo1.maven.org/maven2/' }
              }
          }
          EOF

          echo "✅ Configured Gradle repository mirrors"

      - name: Run Mobile & Web Lint
        run: npm run mobile:lint && npm run web:lint

      - name: Run Mobile Tests
        run: npm run mobile:test:coverage
      - name: Upload mobile coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: mobile/coverage/lcov.info
          flags: mobile
          fail_ci_if_error: false

      - name: Run Mobile & Web Type Check
        run: npm run mobile:typecheck && npm run web:typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        working-directory: .

      - name: Add UV to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH
        working-directory: .

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: api-server/.venv
          key: ${{ runner.os }}-uv-${{ hashFiles('api-server/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install API server dependencies
        working-directory: api-server
        run: uv sync

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017; then
              echo "✅ MongoDB is ready"
              exit 0
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 1
          done
          echo "❌ MongoDB failed to start"
          exit 1

      - name: Run API server tests
        working-directory: api-server
        env:
          MONGO_TEST_URI: mongodb://localhost:27017/guidr_test
        run: uv run pytest
      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: api-server/coverage.lcov
          flags: api
          fail_ci_if_error: false

      - name: Run API server lint
        working-directory: api-server
        run: uv run ruff check .

      - name: Run API server type check
        working-directory: api-server
        run: uv run mypy src

      - name: Build Web App
        run: |
          npm run web:build
          echo "✅ Web app built to web-app/dist/"

      - name: Run semantic-release (dry-run to get version)
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          ./node_modules/.bin/semantic-release --dry-run > release-output.txt 2>&1 || true

          # Show the actual output for debugging
          echo "=== Semantic-Release Output ==="
          cat release-output.txt
          echo "=============================="

          # Fail early if semantic-release itself errored (plugin missing, config broken, etc.)
          if grep -qE "An error occurred while running semantic-release|npm error code 127|semantic-release: not found|Cannot find module" release-output.txt; then
            echo "::error::semantic-release crashed — check output above"
            exit 1
          fi

          # Extract next version from semantic-release output
          if grep -q "The next release version is" release-output.txt; then
            NEXT_VERSION=$(grep "The next release version is" release-output.txt | sed 's/.*The next release version is //' | tr -d '[:space:]')
            echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
            echo "Next version will be: $NEXT_VERSION"
          else
            echo "SHOULD_RELEASE=false" >> $GITHUB_ENV
            echo "No release needed - no relevant commits since last release"
          fi


      - name: Run semantic-release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: ./node_modules/.bin/semantic-release

      - name: Notify release success
        if: env.SHOULD_RELEASE == 'true'
        working-directory: .
        run: |
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type release_success \
            --version "$NEXT_VERSION" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Create Sentry release for API
        if: env.SHOULD_RELEASE == 'true'
        continue-on-error: true
        run: |
          source .sentry/config.env

          VERSION=$(node -p "require('./mobile/package.json').version")
          RELEASE_NAME="guidr-api@${VERSION}"

          echo "📤 Creating Sentry release for API: $RELEASE_NAME"

          npx @sentry/cli releases new "$RELEASE_NAME" \
            --auth-token "${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_API"

          npx @sentry/cli releases set-commits "$RELEASE_NAME" --auto \
            --auth-token "${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_API"

          npx @sentry/cli releases finalize "$RELEASE_NAME" \
            --auth-token "${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_API"

          echo "✅ API Sentry release created and finalized"

      - name: Trigger downstream workflows
        if: env.SHOULD_RELEASE == 'true'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          # Fetch the latest main to get the release commit that was just pushed by semantic-release
          git fetch origin main

          # Get the release commit SHA (the one that semantic-release just created and pushed)
          RELEASE_COMMIT_SHA=$(git rev-parse origin/main)

          # Extract version from package.json
          VERSION=$(node -p "require('./mobile/package.json').version")
          TAG="v${VERSION}"

          # Dispatch repository event that will trigger both Docker and TestFlight workflows
          # Use the correct commit SHA from the release commit that was just pushed
          gh api repos/${{ github.repository }}/dispatches \
            --method POST \
            --field event_type='release-created' \
            --field client_payload[version]="$VERSION" \
            --field client_payload[tag]="$TAG" \
            --field client_payload[commit_sha]="$RELEASE_COMMIT_SHA"

          echo "✅ Dispatched release-created event for version $VERSION with commit SHA: $RELEASE_COMMIT_SHA"

      - name: No release needed
        if: env.SHOULD_RELEASE == 'false'
        working-directory: .
        run: |
          echo "ℹ️  No release will be created"
          echo "Reason: No relevant commits since last release"
          echo ""
          echo "To trigger a release, use conventional commit messages:"
          echo "  feat: for new features (minor version bump)"
          echo "  fix: for bug fixes (patch version bump)"
          echo "  BREAKING CHANGE: for breaking changes (major version bump)"

          # Send Telegram notification
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type release_skip \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
