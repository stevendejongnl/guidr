name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: macos-15
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run semantic-release (dry-run to get version)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run > release-output.txt 2>&1 || true

          # Extract next version from semantic-release output
          if grep -q "The next release version is" release-output.txt; then
            NEXT_VERSION=$(grep "The next release version is" release-output.txt | sed 's/.*The next release version is //' | tr -d '[:space:]')
            echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
            echo "Next version will be: $NEXT_VERSION"
          else
            echo "SHOULD_RELEASE=false" >> $GITHUB_ENV
            echo "No release needed - no relevant commits since last release"
          fi

      - name: Create Sentry properties files
        if: env.SHOULD_RELEASE == 'true'
        run: |
          # Android sentry.properties
          cat > android/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=madebysteven
          defaults.project=guidr
          defaults.url=https://sentry.io/
          EOF

          # iOS sentry.properties (for future iOS builds)
          cat > ios/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=madebysteven
          defaults.project=guidr
          defaults.url=https://sentry.io/
          EOF

          echo "✅ Created Sentry properties files"

      - name: Build Android APK
        if: env.SHOULD_RELEASE == 'true'
        run: |
          # Update version files before building
          chmod +x scripts/sync-version.sh scripts/update-android-version.sh
          ./scripts/update-android-version.sh "$NEXT_VERSION"

          chmod +x android/gradlew
          android/gradlew assembleRelease --no-daemon --stacktrace -p android

          # Get APK size
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH")
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
            echo "Built APK: $APK_PATH (${APK_SIZE} bytes)"
          else
            echo "Warning: APK not found at expected path"
            ls -la android/app/build/outputs/apk/release/ || true
          fi

      - name: Rename APK with version
        if: env.SHOULD_RELEASE == 'true'
        run: |
          VERSION="${{ env.NEXT_VERSION }}"
          OLD_PATH="android/app/build/outputs/apk/release/app-release.apk"
          NEW_PATH="android/app/build/outputs/apk/release/guidr-v${VERSION}.apk"

          mv "$OLD_PATH" "$NEW_PATH"
          echo "✅ Renamed APK to: guidr-v${VERSION}.apk"

          # Verify the file exists
          ls -lh "$NEW_PATH"

      - name: Run semantic-release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Trigger downstream workflows
        if: env.SHOULD_RELEASE == 'true'
        run: |
          # Extract version from package.json
          VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          TAG="v${VERSION}"
          COMMIT_SHA=$(git rev-parse HEAD)

          # Dispatch repository event that will trigger both Docker and TestFlight workflows
          gh api repos/${{ github.repository }}/dispatches \
            --method POST \
            --field event_type='release-created' \
            --field client_payload[version]="$VERSION" \
            --field client_payload[tag]="$TAG" \
            --field client_payload[commit_sha]="$COMMIT_SHA"

          echo "✅ Dispatched release-created event for version $VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No release needed
        if: env.SHOULD_RELEASE == 'false'
        run: |
          echo "ℹ️  No release will be created"
          echo "Reason: No relevant commits since last release"
          echo ""
          echo "To trigger a release, use conventional commit messages:"
          echo "  feat: for new features (minor version bump)"
          echo "  fix: for bug fixes (patch version bump)"
          echo "  BREAKING CHANGE: for breaking changes (major version bump)"
