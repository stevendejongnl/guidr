name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create Sentry properties files
        run: |
          cat > android/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=madebysteven
          defaults.project=guidr
          defaults.url=https://sentry.io/
          EOF

          cat > ios/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=madebysteven
          defaults.project=guidr
          defaults.url=https://sentry.io/
          EOF

          echo "✅ Created Sentry properties files for Android and iOS"

      - name: Setup Java for Android builds
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Gradle repositories
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/repositories.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      google()
                      maven { url 'https://dl.google.com/android/maven2/' }
                      mavenCentral()
                      maven { url 'https://repo1.maven.org/maven2/' }
                  }
              }
              repositories {
                  google()
                  maven { url 'https://dl.google.com/android/maven2/' }
                  mavenCentral()
                  maven { url 'https://repo1.maven.org/maven2/' }
              }
          }
          EOF

          echo "✅ Configured Gradle repository mirrors"

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true
        working-directory: .

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: api-server/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('api-server/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install API server dependencies
        working-directory: api-server
        run: poetry install

      - name: Run API server tests
        working-directory: api-server
        run: poetry run pytest

      - name: Run API server lint
        working-directory: api-server
        run: poetry run ruff check .

      - name: Run API server type check
        working-directory: api-server
        run: poetry run mypy src

      - name: Build Web App
        working-directory: web-app
        run: |
          npm install
          npm run build
          echo "✅ Web app built to web-app/dist/"

      - name: Run semantic-release (dry-run to get version)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run > release-output.txt 2>&1 || true

          # Extract next version from semantic-release output
          if grep -q "The next release version is" release-output.txt; then
            NEXT_VERSION=$(grep "The next release version is" release-output.txt | sed 's/.*The next release version is //' | tr -d '[:space:]')
            echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
            echo "Next version will be: $NEXT_VERSION"
          else
            echo "SHOULD_RELEASE=false" >> $GITHUB_ENV
            echo "No release needed - no relevant commits since last release"
          fi


      - name: Run semantic-release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Trigger downstream workflows
        if: env.SHOULD_RELEASE == 'true'
        working-directory: .
        run: |
          # Extract version from package.json
          VERSION=$(grep '"version"' mobile/package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
          TAG="v${VERSION}"
          COMMIT_SHA=$(git rev-parse HEAD)

          # Dispatch repository event that will trigger both Docker and TestFlight workflows
          gh api repos/${{ github.repository }}/dispatches \
            --method POST \
            --field event_type='release-created' \
            --field client_payload[version]="$VERSION" \
            --field client_payload[tag]="$TAG" \
            --field client_payload[commit_sha]="$COMMIT_SHA"

          echo "✅ Dispatched release-created event for version $VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .

      - name: No release needed
        if: env.SHOULD_RELEASE == 'false'
        run: |
          echo "ℹ️  No release will be created"
          echo "Reason: No relevant commits since last release"
          echo ""
          echo "To trigger a release, use conventional commit messages:"
          echo "  feat: for new features (minor version bump)"
          echo "  fix: for bug fixes (patch version bump)"
          echo "  BREAKING CHANGE: for breaking changes (major version bump)"
