name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: macos-15
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run semantic-release (dry-run to get version)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run > release-output.txt 2>&1 || true

          # Extract next version from semantic-release output
          if grep -q "The next release version is" release-output.txt; then
            NEXT_VERSION=$(grep "The next release version is" release-output.txt | sed 's/.*The next release version is //' | tr -d '[:space:]')
            echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
            echo "Next version will be: $NEXT_VERSION"
          else
            echo "SHOULD_RELEASE=false" >> $GITHUB_ENV
            echo "No release needed - no relevant commits since last release"
          fi

      - name: Build iOS IPA
        if: env.SHOULD_RELEASE == 'true'
        run: |
          cd ios

          # Build archive without signing
          xcodebuild \
            -workspace guidr.xcworkspace \
            -scheme guidr \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/guidr.xcarchive \
            -allowProvisioningUpdates \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

          # Export unsigned IPA with proper structure
          xcodebuild \
            -exportArchive \
            -archivePath ./build/guidr.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist ./ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -allowProvisioningUpdates || {
              # Fallback: manual IPA creation if export fails
              echo "Export failed, creating IPA manually..."
              mkdir -p ./build/Payload
              cp -r ./build/guidr.xcarchive/Products/Applications/guidr.app ./build/Payload/
              (cd ./build && zip -r guidr-unsigned.ipa Payload)
            }

          # Rename if export succeeded
          if [ -f ./build/guidr.ipa ]; then
            mv ./build/guidr.ipa ./build/guidr-unsigned.ipa
          fi

          # Get IPA size
          IPA_SIZE=$(stat -f%z ./build/guidr-unsigned.ipa)
          echo "IPA_SIZE=$IPA_SIZE" >> $GITHUB_ENV

          echo "Built IPA: $(pwd)/build/guidr-unsigned.ipa (${IPA_SIZE} bytes)"

      - name: Build Android APK
        if: env.SHOULD_RELEASE == 'true'
        run: |
          chmod +x android/gradlew
          android/gradlew assembleRelease --no-daemon --stacktrace -p android

          # Get APK size
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH")
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
            echo "Built APK: $APK_PATH (${APK_SIZE} bytes)"
          else
            echo "Warning: APK not found at expected path"
            ls -la android/app/build/outputs/apk/release/ || true
          fi

      - name: Generate AltStore source JSON
        if: env.SHOULD_RELEASE == 'true'
        run: |
          cat > altstore-source.json << EOF
          {
            "name": "Guidr",
            "identifier": "com.guidr.source",
            "subtitle": "Step-by-step guide execution app",
            "description": "Guidr helps you execute multi-step processes with precise timing - from recipes to workout routines, lab protocols, and study sessions.",
            "website": "https://github.com/${{ github.repository }}",
            "tintColor": "#007AFF",
            "apps": [
              {
                "name": "Guidr",
                "bundleIdentifier": "com.guidr",
                "developerName": "Guidr Project",
                "subtitle": "Guide execution with precise timing",
                "localizedDescription": "Execute multi-step processes with precision. Perfect for recipes, workouts, lab protocols, and study sessions. Built with React Native.",
                "tintColor": "#007AFF",
                "category": "productivity",
                "versions": [
                  {
                    "version": "${{ env.NEXT_VERSION }}",
                    "date": "$(date -u +%Y-%m-%d)",
                    "localizedDescription": "See CHANGELOG.md for release notes",
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/v${{ env.NEXT_VERSION }}/guidr-unsigned.ipa",
                    "size": ${{ env.IPA_SIZE }},
                    "minOSVersion": "15.1"
                  }
                ],
                "appPermissions": {
                  "entitlements": [
                    {
                      "name": "keychain-access-groups"
                    },
                    {
                      "name": "com.apple.security.application-groups"
                    }
                  ],
                  "privacy": {
                    "NSLocationWhenInUseUsageDescription": "Not used - placeholder for future features"
                  }
                }
              }
            ],
            "news": []
          }
          EOF

      - name: Run semantic-release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Trigger TestFlight deployment after release
      - name: Trigger TestFlight deployment
        if: env.SHOULD_RELEASE == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'testflight-deploy.yml',
              ref: 'main'
            })

      - name: No release needed
        if: env.SHOULD_RELEASE == 'false'
        run: |
          echo "ℹ️  No release will be created"
          echo "Reason: No relevant commits since last release"
          echo ""
          echo "To trigger a release, use conventional commit messages:"
          echo "  feat: for new features (minor version bump)"
          echo "  fix: for bug fixes (patch version bump)"
          echo "  BREAKING CHANGE: for breaking changes (major version bump)"
