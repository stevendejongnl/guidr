name: Android Release
run-name: "Android Release ${{ github.event.client_payload.version || inputs.version || '' }}"

on:
  # Trigger when a new release is created
  repository_dispatch:
    types: [release-created]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.2.3)'
        required: false
        type: string

permissions:
  contents: write  # Required to upload assets to release

jobs:
  android-build-release:
    name: Build and Upload Android APK
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    # Cancel any in-progress Android build when a newer release is triggered
    concurrency:
      group: android-release
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger: use input or package.json
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(grep '"version"' mobile/package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
            fi
          else
            # repository_dispatch trigger: use event payload
            VERSION="${{ github.event.client_payload.version }}"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --workspaces --include=dev
        # IMPORTANT: --workspaces flag installs all workspace packages including mobile's devDependencies
        # Without this, Metro bundler fails with "Cannot resolve @react-native/metro-config"
        # This is required for the npm workspace restructuring to work correctly
        # See: docs/CI_CD_TROUBLESHOOTING.md#issue-android-release-build-fails

      - name: Build shared package
        run: npm run build:shared

      - name: Create mobile .env file with Sentry DSN
        run: |
          cat > mobile/.env <<EOF
          SENTRY_DSN=${{ secrets.MOBILE_SENTRY_DSN }}
          EOF
          sed -i "s/^[[:space:]]*//" mobile/.env

          echo "✅ Created mobile .env file with Sentry configuration"

      - name: Create Sentry properties file
        run: |
          source .sentry/config.env

          cat > mobile/android/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=$SENTRY_ORG
          defaults.project=$SENTRY_PROJECT_MOBILE
          defaults.url=$SENTRY_URL
          EOF
          sed -i "s/^[[:space:]]*//" mobile/android/sentry.properties

          echo "✅ Created Android Sentry properties file"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          key: android-sdk-36-bt36-ndk27.1.12297006

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Update Android version
        run: |
          chmod +x scripts/update-android-version.sh
          scripts/update-android-version.sh "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Decode and setup Android Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # Decode the base64 keystore
          echo "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/guidr-release.keystore"

          # Verify keystore was created
          if [ ! -f "${{ runner.temp }}/guidr-release.keystore" ]; then
            echo "Error: Failed to decode keystore"
            exit 1
          fi

          echo "✅ Keystore decoded successfully"
          ls -lh "${{ runner.temp }}/guidr-release.keystore"

      - name: Build Android APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/guidr-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: guidr-release
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd mobile
          chmod +x android/gradlew
          ./android/gradlew assembleRelease --no-daemon --stacktrace -p android

          # Get APK info
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH")
            echo "Built APK: $APK_PATH (${APK_SIZE} bytes)"
          else
            echo "Error: APK not found at expected path"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi

      - name: Rename APK with version
        working-directory: mobile
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          OLD_PATH="android/app/build/outputs/apk/release/app-release.apk"
          NEW_PATH="android/app/build/outputs/apk/release/guidr-v${VERSION}.apk"

          mv "$OLD_PATH" "$NEW_PATH"
          echo "✅ Renamed APK to: guidr-v${VERSION}.apk"
          ls -lh "$NEW_PATH"

      - name: Upload APK to GitHub Release
        working-directory: .
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          APK_PATH="mobile/android/app/build/outputs/apk/release/guidr-v${VERSION}.apk"

          gh release upload "v${VERSION}" "$APK_PATH" \
            --clobber \
            --repo "${{ github.repository }}"

          echo "✅ Uploaded APK to release v${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Sentry release with commits
        if: success()
        continue-on-error: true
        run: |
          source .sentry/config.env

          VERSION="${{ steps.version.outputs.VERSION }}"
          BUILD_CODE=$(grep 'versionCode' mobile/android/app/build.gradle | head -1 | sed 's/.*versionCode //' | tr -d '[:space:]')
          RELEASE_NAME="com.guidr@${VERSION}+${BUILD_CODE}"

          echo "📤 Creating Sentry release: $RELEASE_NAME"

          npx @sentry/cli releases new "$RELEASE_NAME" \
            --auth-token "${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_MOBILE"

          npx @sentry/cli releases set-commits "$RELEASE_NAME" --auto \
            --auth-token "${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_MOBILE"

          npx @sentry/cli releases finalize "$RELEASE_NAME" \
            --auth-token "${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_MOBILE"

          echo "✅ Sentry release created and finalized"

      - name: Notify Android success
        if: success()
        run: |
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type android_success \
            --version "${{ steps.version.outputs.VERSION }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Get failure details
        if: failure()
        id: error_details
        run: |
          # Fetch logs from GitHub API and extract last lines of errors
          gh run view ${{ github.run_id }} --log-failed > /tmp/error.txt 2>&1 || echo "Failed to fetch logs" > /tmp/error.txt

          # Extract last 10 lines of error output
          ERROR=$(tail -20 /tmp/error.txt | head -10 | sed 's/"/\\"/g')
          echo "ERROR_MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$ERROR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Get failed step name from logs
          FAILED_STEP=$(grep -oE "##\\[error\\].*" /tmp/error.txt | head -1 | sed 's/##\[error\]//' | sed 's/^[ \t]*//' | cut -d' ' -f1-5)
          if [ -z "$FAILED_STEP" ]; then
            FAILED_STEP="Build and Upload Android APK"
          fi
          echo "FAILED_STEP=$FAILED_STEP" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Notify Android failure
        if: failure()
        run: |
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type android_failure \
            --version "${{ steps.version.outputs.VERSION }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --step "${{ steps.error_details.outputs.FAILED_STEP || 'Build and Upload Android APK' }}" \
            --error "${{ steps.error_details.outputs.ERROR_MSG || 'Check logs for details' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Build complete
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "✅ Android APK build and upload complete!"
          echo ""
          echo "Version: $VERSION"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"

