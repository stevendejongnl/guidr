name: Android Release
run-name: "Android Release ${{ github.event.client_payload.version || inputs.version || '' }}"

on:
  # Trigger when a new release is created
  repository_dispatch:
    types: [release-created]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.2.3)'
        required: false
        type: string

permissions:
  contents: write  # Required to upload assets to release

jobs:
  android-build-release:
    name: Build and Upload Android APK
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger: use input or package.json
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
            fi
          else
            # repository_dispatch trigger: use event payload
            VERSION="${{ github.event.client_payload.version }}"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Create Sentry properties file
        run: |
          cat > android/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=madebysteven
          defaults.project=guidr
          defaults.url=https://sentry.io/
          EOF

          echo "✅ Created Android Sentry properties file"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          key: android-sdk-36-bt36-ndk27.1.12297006

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Update Android version
        run: |
          chmod +x ../scripts/update-android-version.sh
          ../scripts/update-android-version.sh "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          android/gradlew assembleRelease --no-daemon --stacktrace -p android

          # Get APK info
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH")
            echo "Built APK: $APK_PATH (${APK_SIZE} bytes)"
          else
            echo "Error: APK not found at expected path"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi

      - name: Rename APK with version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          OLD_PATH="android/app/build/outputs/apk/release/app-release.apk"
          NEW_PATH="android/app/build/outputs/apk/release/guidr-v${VERSION}.apk"

          mv "$OLD_PATH" "$NEW_PATH"
          echo "✅ Renamed APK to: guidr-v${VERSION}.apk"
          ls -lh "$NEW_PATH"

      - name: Upload APK to GitHub Release
        working-directory: .
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          APK_PATH="mobile/android/app/build/outputs/apk/release/guidr-v${VERSION}.apk"

          gh release upload "v${VERSION}" "$APK_PATH" \
            --clobber \
            --repo "${{ github.repository }}"

          echo "✅ Uploaded APK to release v${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Android success
        if: success()
        run: |
          chmod +x ../scripts/send-telegram-notification.sh
          ../scripts/send-telegram-notification.sh \
            --type android_success \
            --version "${{ steps.version.outputs.VERSION }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify Android failure
        if: failure()
        run: |
          chmod +x ../scripts/send-telegram-notification.sh
          ../scripts/send-telegram-notification.sh \
            --type android_failure \
            --version "${{ steps.version.outputs.VERSION }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Build complete
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "✅ Android APK build and upload complete!"
          echo ""
          echo "Version: $VERSION"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"

