name: Gitea Access Test
run-name: "Gitea Access Test - ${{ github.actor }} - ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: 'Custom test message to include in commit'
        required: false
        default: 'Automated test from GitHub Actions'
        type: string

permissions:
  contents: read

jobs:
  test-gitea-access:
    name: Test Gitea SSH Access
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout current repository (for context/logging)
      - name: Checkout guidr repository
        uses: actions/checkout@v4

      # Step 2: Bypass Cloudflare protection using IP whitelisting
      - name: Bypass Cloudflare for Gitea access
        uses: xiaotianxt/bypass-cloudflare-for-github-action@v2.1.0
        with:
          cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          cf_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          disable_bot_fight_mode: 'true'
          bfm_propagation_delay: 15

      # Step 3: Install cloudflared
      - name: Install cloudflared
        run: |
          # Add Cloudflare GPG key and repository
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null

          # Add Cloudflare apt repository
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared jammy main' | sudo tee /etc/apt/sources.list.d/cloudflared.list

          # Update package list and install cloudflared
          sudo apt-get update
          sudo apt-get install -y cloudflared

          # Verify installation
          cloudflared --version
          echo "✅ cloudflared installed successfully"

      # Step 4: Setup SSH directory with proper permissions
      - name: Setup SSH directory
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "✅ SSH directory created"

      # Step 5: Install SSH private key from secrets
      - name: Install SSH private key
        run: |
          echo "${{ secrets.GITEA_SSH_PRIVATE_KEY }}" > ~/.ssh/gitea_key
          chmod 600 ~/.ssh/gitea_key

          # Debug: Check key format and permissions
          echo "SSH key file permissions:"
          ls -la ~/.ssh/gitea_key

          echo ""
          echo "SSH key file format check:"
          head -n 1 ~/.ssh/gitea_key

          echo ""
          echo "SSH key validation:"
          ssh-keygen -l -f ~/.ssh/gitea_key || echo "⚠️ Key validation failed - check key format"

          echo "✅ SSH private key installed"

      # Step 6: Install SSH known hosts
      - name: Install SSH known hosts
        run: |
          echo "${{ secrets.GITEA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Debug: Check known_hosts format
          echo "Known hosts file:"
          cat ~/.ssh/known_hosts
          echo ""
          echo "✅ SSH known hosts installed"

      # Step 7: Configure SSH with cloudflared access proxy
      - name: Configure SSH with cloudflared access proxy
        run: |
          cat > ~/.ssh/config <<'SSHEOF'
          Host gitaccess.madebysteven.nl
            HostName gitaccess.madebysteven.nl
            User gitea
            Port 22
            IdentityFile ~/.ssh/gitea_key
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ProxyCommand /usr/bin/cloudflared access ssh --hostname %h
          SSHEOF

          chmod 600 ~/.ssh/config

          echo "SSH config:"
          cat ~/.ssh/config
          echo ""
          echo "✅ SSH config configured with cloudflared access proxy"

      # Step 7b: Configure cloudflared service token authentication
      - name: Configure cloudflared service token
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          # Check if service tokens are configured
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "⚠️ WARNING: Cloudflare Access service tokens not configured"
            echo "   If authentication fails, you may need to set:"
            echo "   - CLOUDFLARE_ACCESS_CLIENT_ID"
            echo "   - CLOUDFLARE_ACCESS_CLIENT_SECRET"
            echo ""
            echo "Proceeding without service token authentication..."
          else
            echo "✅ Cloudflare Access service tokens are configured"
            echo "   Client ID: ${CF_ACCESS_CLIENT_ID:0:10}..."

            # Export tokens for cloudflared to use
            export CF_ACCESS_CLIENT_ID
            export CF_ACCESS_CLIENT_SECRET
          fi

          echo "Testing cloudflared access tunnel connectivity..."
          timeout 10 cloudflared access ssh --hostname gitaccess.madebysteven.nl --help 2>&1 || echo "cloudflared command check complete"
          echo "✅ cloudflared is configured"

      # Step 8: Verify SSH connection through cloudflared
      - name: Verify SSH connection to Gitea
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          echo "Verifying SSH connection to Gitea through cloudflared access..."
          echo ""
          echo "Debug: Testing SSH connection with verbose output..."
          ssh -vvv -T gitea@gitaccess.madebysteven.nl 2>&1 | tee /tmp/ssh_test.log || true

          echo ""
          echo "=========================================="
          echo "SSH Connection Test Results"
          echo "=========================================="

          # Gitea returns exit code 1 for successful auth with "Hi there, You've successfully authenticated"
          if grep -q "successfully authenticated" /tmp/ssh_test.log; then
            echo "✅ SSH authentication successful through cloudflared"
          else
            echo "❌ SSH authentication failed"
            echo ""
            echo "Error details:"
            if grep -q "Permission denied" /tmp/ssh_test.log; then
              echo "  - Permission denied: SSH key might not be authorized on Gitea server"
              echo "  - Check that the public key is added to your Gitea user account"
            fi
            if grep -q "Connection refused" /tmp/ssh_test.log; then
              echo "  - Connection refused: cloudflared tunnel might not be working"
            fi
            if grep -q "No such identity" /tmp/ssh_test.log; then
              echo "  - SSH key file issue detected"
            fi
            if grep -q "Access" /tmp/ssh_test.log && grep -q "denied\|unauthorized" /tmp/ssh_test.log; then
              echo "  - Cloudflare Access authentication failed"
              echo "  - You may need to configure CLOUDFLARE_ACCESS_CLIENT_ID and CLOUDFLARE_ACCESS_CLIENT_SECRET"
            fi
            echo ""
            echo "Full connection output:"
            cat /tmp/ssh_test.log
            exit 1
          fi

      # Step 9: Clone the Gitea repository
      - name: Clone guidr-certificates repository
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          git clone gitea@gitaccess.madebysteven.nl:stevendejong/guidr-certificates.git /tmp/guidr-certificates
          cd /tmp/guidr-certificates
          echo "✅ Repository cloned successfully"
          echo "Repository contents:"
          ls -la

      # Step 10: Configure Git identity
      - name: Configure Git identity
        run: |
          cd /tmp/guidr-certificates
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "✅ Git identity configured"

      # Step 11: Create/modify test file with timestamp
      - name: Create test file
        env:
          TEST_MESSAGE: ${{ inputs.test_message }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cd /tmp/guidr-certificates

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          WORKFLOW_RUN=${{ github.run_number }}

          cat > .github-actions-test <<'TESTEOF'
          # GitHub Actions Test File

          Last successful test: TIMESTAMP_PLACEHOLDER
          Workflow run: WORKFLOW_RUN_PLACEHOLDER
          Triggered by: GITHUB_ACTOR_PLACEHOLDER
          Test message: TEST_MESSAGE_PLACEHOLDER

          This file is automatically generated by the Gitea Access Test workflow
          to verify SSH access and git operations through Cloudflare protection.
          TESTEOF

          # Replace placeholders with actual values to prevent injection
          sed -i "s|TIMESTAMP_PLACEHOLDER|${TIMESTAMP}|g" .github-actions-test
          sed -i "s|WORKFLOW_RUN_PLACEHOLDER|${WORKFLOW_RUN}|g" .github-actions-test
          sed -i "s|GITHUB_ACTOR_PLACEHOLDER|${GITHUB_ACTOR}|g" .github-actions-test
          sed -i "s|TEST_MESSAGE_PLACEHOLDER|${TEST_MESSAGE}|g" .github-actions-test

          echo "✅ Test file created with timestamp: ${TIMESTAMP}"
          cat .github-actions-test

      # Step 12: Commit changes
      - name: Commit test file
        run: |
          cd /tmp/guidr-certificates
          git add .github-actions-test

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit (file unchanged)"
            echo "TEST_COMMITTED=false" >> $GITHUB_ENV
          else
            git commit -m "test: verify GitHub Actions Gitea access - run ${{ github.run_number }}"
            echo "✅ Changes committed"
            echo "TEST_COMMITTED=true" >> $GITHUB_ENV
            git log -1 --stat
          fi

      # Step 13: Push changes to Gitea
      - name: Push changes to Gitea
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          cd /tmp/guidr-certificates

          if [ "${{ env.TEST_COMMITTED }}" = "true" ]; then
            git push origin main
            echo "✅ Changes pushed to Gitea successfully"
          else
            echo "No changes to push (file unchanged)"
          fi

      # Step 14: Pull latest changes to verify round-trip
      - name: Verify round-trip by pulling latest
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          cd /tmp/guidr-certificates
          git fetch origin
          git pull origin main
          echo "✅ Successfully pulled latest changes"
          echo ""
          echo "Latest commit:"
          git log -1 --oneline

      # Step 15: Validate test file exists and has correct content
      - name: Validate test file
        run: |
          cd /tmp/guidr-certificates

          if [ -f .github-actions-test ]; then
            echo "✅ Test file exists"
            echo ""
            echo "Test file contents:"
            cat .github-actions-test

            # Verify it contains expected data
            if grep -q "Workflow run: ${{ github.run_number }}" .github-actions-test; then
              echo ""
              echo "✅ Test file contains correct workflow run number"
            else
              echo ""
              echo "❌ Test file does not contain expected workflow run number"
              exit 1
            fi
          else
            echo "❌ Test file does not exist"
            exit 1
          fi

      # Step 16: Test summary
      - name: Test summary
        run: |
          echo "=========================================="
          echo "Gitea Access Test - PASSED ✅"
          echo "=========================================="
          echo ""
          echo "Workflow run: ${{ github.run_number }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo ""
          echo "Verified operations:"
          echo "  ✅ Cloudflare IP whitelisting"
          echo "  ✅ cloudflared installed and configured"
          echo "  ✅ SSH authentication to Gitea via cloudflared tunnel"
          echo "  ✅ Repository clone"
          echo "  ✅ File creation/modification"
          echo "  ✅ Git commit"
          echo "  ✅ Git push"
          echo "  ✅ Git pull (round-trip verification)"
          echo "  ✅ File validation"
          echo ""
          echo "All Gitea access operations completed successfully!"

      # Step 17: Cleanup (always runs, even on failure)
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up SSH keys and temporary files..."
          rm -f ~/.ssh/gitea_key
          rm -f ~/.ssh/known_hosts
          rm -f ~/.ssh/config
          rm -rf /tmp/guidr-certificates
          rm -f /tmp/ssh_test.log
          sudo apt-get remove -y cloudflared || true
          echo "✅ Cleanup completed"

      # Step 18: Report failure (only runs on failure)
      - name: Report test failure
        if: failure()
        run: |
          echo "=========================================="
          echo "Gitea Access Test - FAILED ❌"
          echo "=========================================="
          echo ""
          echo "The test failed at one of the following stages:"
          echo "  1. Cloudflare bypass"
          echo "  2. SSH authentication"
          echo "  3. Repository operations (clone/commit/push/pull)"
          echo "  4. File validation"
          echo ""
          echo "Check the logs above for detailed error messages."
          echo "Verify that all required secrets are correctly configured:"
          echo "  - CLOUDFLARE_ACCOUNT_ID"
          echo "  - CLOUDFLARE_ZONE_ID"
          echo "  - CLOUDFLARE_API_TOKEN"
          echo "  - CLOUDFLARE_ACCESS_CLIENT_ID (for cloudflared SSH tunneling)"
          echo "  - CLOUDFLARE_ACCESS_CLIENT_SECRET (for cloudflared SSH tunneling)"
          echo "  - GITEA_SSH_PRIVATE_KEY"
          echo "  - GITEA_SSH_KNOWN_HOSTS"
