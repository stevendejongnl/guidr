name: Release iOS for AltStore

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release-ios:
    name: Build and Release iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Set version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Build iOS IPA for device
        run: |
          cd ios

          # Build archive for device
          xcodebuild \
            -workspace guidr.xcworkspace \
            -scheme guidr \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/guidr.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

          # Create unsigned IPA
          mkdir -p ./build/Payload
          cp -r ./build/guidr.xcarchive/Products/Applications/guidr.app ./build/Payload/
          cd ./build
          zip -r guidr-unsigned.ipa Payload

          # Get IPA size
          IPA_SIZE=$(stat -f%z guidr-unsigned.ipa)
          echo "IPA_SIZE=$IPA_SIZE" >> $GITHUB_ENV

      - name: Create AltStore source JSON
        run: |
          cat > altstore-source.json << 'EOF'
          {
            "name": "Guidr",
            "identifier": "com.guidr.source",
            "subtitle": "Step-by-step guide execution app",
            "description": "Guidr helps you execute multi-step processes with precise timing - from recipes to workout routines, lab protocols, and study sessions.",
            "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/assets/icon.png",
            "headerURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/assets/header.png",
            "website": "https://github.com/${{ github.repository }}",
            "tintColor": "#007AFF",
            "apps": [
              {
                "name": "Guidr",
                "bundleIdentifier": "com.guidr",
                "developerName": "Guidr Team",
                "subtitle": "Guide execution with precise timing",
                "localizedDescription": "Execute multi-step processes with precision. Perfect for recipes, workouts, lab protocols, and study sessions. Built with React Native.",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/assets/app-icon.png",
                "tintColor": "#007AFF",
                "category": "productivity",
                "screenshots": [],
                "versions": [
                  {
                    "version": "${{ env.VERSION }}",
                    "date": "$(date -u +%Y-%m-%d)",
                    "localizedDescription": "Initial release with core functionality:\n- Execute step-by-step guides\n- Precise timing for each step\n- Session state management\n- Domain-driven architecture",
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/guidr-unsigned.ipa",
                    "size": ${{ env.IPA_SIZE }},
                    "minOSVersion": "13.0",
                    "maxOSVersion": "18.0"
                  }
                ],
                "appPermissions": {
                  "entitlements": [],
                  "privacy": {}
                }
              }
            ],
            "news": []
          }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## Guidr v${{ env.VERSION }}

            ### Installation via AltStore

            1. Add this source to AltStore:
               ```
               https://raw.githubusercontent.com/${{ github.repository }}/main/altstore-source.json
               ```
            2. Install Guidr from the source

            ### Manual Installation

            Download `guidr-unsigned.ipa` and sideload with:
            - AltStore
            - Sideloadly
            - Any other sideloading tool

            **Note**: This is an unsigned IPA. AltStore will sign it with your Apple ID when installing.

            ### What's New
            - Initial release
            - Step-by-step guide execution
            - Precise timing control
            - Session management
          files: |
            ios/build/guidr-unsigned.ipa
            altstore-source.json
          draft: false
          prerelease: false

      - name: Commit source JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if file changed
          if ! git diff --quiet altstore-source.json 2>/dev/null; then
            git add altstore-source.json
            git commit -m "Update AltStore source for v${{ env.VERSION }}" || true
            git push || true
          fi
