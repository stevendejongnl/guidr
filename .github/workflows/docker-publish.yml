name: Docker Publish

on:
  # Trigger when a new release is created
  repository_dispatch:
    types: [release-created]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., 1.2.3)'
        required: false
        type: string

permissions:
  contents: read
  packages: write  # Required for GHCR

jobs:
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Only run if manual trigger or release-created event
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          git fetch --tags

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger: use input or package.json
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
            fi
          else
            # repository_dispatch trigger: use event payload
            VERSION="${{ github.event.client_payload.version }}"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        if: steps.version.outputs.VERSION != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.VERSION != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: steps.version.outputs.VERSION != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/guidr-test-server
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: steps.version.outputs.VERSION != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./test-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GUIDR_VERSION=${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published
        if: steps.version.outputs.VERSION != ''
        run: |
          echo "✅ Docker image published successfully!"
          echo ""
          echo "Image tags created:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Pull command:"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/guidr-test-server:${{ steps.version.outputs.VERSION }}"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/guidr-test-server:latest"
          echo ""
          echo "Run command:"
          echo "  docker run -p 8000:8000 ghcr.io/${{ github.repository_owner }}/guidr-test-server:latest"
