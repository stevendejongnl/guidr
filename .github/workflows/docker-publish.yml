name: Docker Publish
run-name: "Docker Publish ${{ github.event.client_payload.version || inputs.version || '' }}"

on:
  # Trigger when a new release is created
  repository_dispatch:
    types: [release-created]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., 1.2.3)'
        required: false
        type: string

permissions:
  contents: read
  packages: write  # Required for GHCR

jobs:
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Only run if manual trigger or release-created event
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    # Serialize Cloudflare bypass operations to avoid rate limiting
    concurrency:
      group: cloudflare-bypass
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          git fetch --tags

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger: use input or package.json
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(grep '"version"' mobile/package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
            fi
          else
            # repository_dispatch trigger: use event payload
            VERSION="${{ github.event.client_payload.version }}"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        if: steps.version.outputs.VERSION != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.VERSION != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: steps.version.outputs.VERSION != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/guidr-api-server
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: steps.version.outputs.VERSION != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GUIDR_VERSION=${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published
        if: steps.version.outputs.VERSION != ''
        run: |
          echo "✅ Docker image published successfully!"
          echo ""
          echo "Image tags created:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Pull command:"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/guidr-api-server:${{ steps.version.outputs.VERSION }}"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/guidr-api-server:latest"
          echo ""
          echo "Run command:"
          echo "  docker run -p 8000:8000 ghcr.io/${{ github.repository_owner }}/guidr-api-server:latest"

      - name: Bypass Cloudflare for Kubernetes deployment
        if: steps.version.outputs.VERSION != ''
        uses: xiaotianxt/bypass-cloudflare-for-github-action@v2.1.0
        with:
          cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          cf_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          disable_bot_fight_mode: 'true'
          bfm_propagation_delay: 45

      - name: Deploy to Kubernetes
        if: steps.version.outputs.VERSION != ''
        run: |
          curl -X PATCH \
            '${{ secrets.KUBECTL_API_URL }}/api/v1/deployments/guidr/guidr-api-server/image' \
            -H 'accept: application/json' \
            -H 'Authorization: Bearer ${{ secrets.KUBECTL_API_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: GitHub-Actions' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -d '{
            "container": "api-server",
            "image": "ghcr.io/${{ github.repository_owner }}/guidr-api-server:${{ steps.version.outputs.VERSION }}"
          }'
          echo "✅ Deployment updated successfully!"

      - name: Notify Docker success
        if: success() && steps.version.outputs.VERSION != ''
        run: |
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type docker_success \
            --version "${{ steps.version.outputs.VERSION }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Get failure details
        if: failure()
        id: error_details
        run: |
          # Fetch logs from GitHub API and extract last lines of errors
          gh run view ${{ github.run_id }} --log-failed > /tmp/error.txt 2>&1 || echo "Failed to fetch logs" > /tmp/error.txt

          # Extract last 10 lines of error output
          ERROR=$(tail -20 /tmp/error.txt | head -10 | sed 's/"/\\"/g')
          echo "ERROR_MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$ERROR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Get failed step name from logs
          FAILED_STEP=$(grep -oP "##\[error\].*" /tmp/error.txt | head -1 | sed 's/##\[error\]//' | sed 's/^[ \t]*//' | cut -d' ' -f1-5)
          if [ -z "$FAILED_STEP" ]; then
            FAILED_STEP="Build and Push Docker Image"
          fi
          echo "FAILED_STEP=$FAILED_STEP" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Notify Docker failure
        if: failure()
        run: |
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type docker_failure \
            --version "${{ steps.version.outputs.VERSION }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --step "${{ steps.error_details.outputs.FAILED_STEP || 'Build and Push Docker Image' }}" \
            --error "${{ steps.error_details.outputs.ERROR_MSG || 'Check logs for details' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
