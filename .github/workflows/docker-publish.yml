name: Docker Publish
run-name: "Docker Publish ${{ github.event.client_payload.version || inputs.version || '' }}"

on:
  # Trigger when a new release is created
  repository_dispatch:
    types: [release-created]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g., 1.2.3)'
        required: false
        type: string

permissions:
  contents: read
  packages: write  # Required for GHCR

# Cancel any in-progress Docker publish when a newer release is triggered
concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Only run if manual trigger or release-created event
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          git fetch --tags

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger: use input or package.json
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(grep '"version"' mobile/package.json | head -1 | sed 's/.*: "\(.*\)".*/\1/')
            fi
          else
            # repository_dispatch trigger: use event payload
            VERSION="${{ github.event.client_payload.version }}"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Node.js
        if: steps.version.outputs.VERSION != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.version.outputs.VERSION != ''
        run: npm ci --include=dev

      - name: Build web app
        if: steps.version.outputs.VERSION != ''
        run: npm run web:build

      - name: Inject and upload web source maps
        if: steps.version.outputs.VERSION != ''
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          source .sentry/config.env
          export SENTRY_URL="$SENTRY_URL"

          npx @sentry/cli sourcemaps inject ./web-app/dist
          npx @sentry/cli sourcemaps upload ./web-app/dist \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT_WEB"

          echo "✅ Web source maps injected and uploaded to Sentry"

      - name: Set up Docker Buildx
        if: steps.version.outputs.VERSION != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.VERSION != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: steps.version.outputs.VERSION != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/guidr-api-server
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: steps.version.outputs.VERSION != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GUIDR_VERSION=${{ steps.version.outputs.VERSION }}
            SKIP_WEB_BUILD=true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published
        if: steps.version.outputs.VERSION != ''
        run: |
          echo "✅ Docker image published successfully!"
          echo ""
          echo "Image tags created:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Pull command:"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/guidr-api-server:${{ steps.version.outputs.VERSION }}"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/guidr-api-server:latest"
          echo ""
          echo "Run command:"
          echo "  docker run -p 8000:8000 ghcr.io/${{ github.repository_owner }}/guidr-api-server:latest"

      - name: Notify Docker success
        if: success() && steps.version.outputs.VERSION != ''
        run: |
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type docker_success \
            --version "${{ steps.version.outputs.VERSION }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"
        env:
          APPRISE_URL: ${{ secrets.APPRISE_URL }}

      - name: Get failure details
        if: failure()
        id: error_details
        run: |
          # Fetch logs from GitHub API and extract last lines of errors
          gh run view ${{ github.run_id }} --log-failed > /tmp/error.txt 2>&1 || echo "Failed to fetch logs" > /tmp/error.txt

          # Extract last 10 lines of error output
          ERROR=$(tail -20 /tmp/error.txt | head -10 | sed 's/"/\\"/g')
          echo "ERROR_MSG<<EOF" >> $GITHUB_OUTPUT
          echo "$ERROR" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Get failed step name from logs
          FAILED_STEP=$(grep -oE "##\\[error\\].*" /tmp/error.txt | head -1 | sed 's/##\[error\]//' | sed 's/^[ \t]*//' | cut -d' ' -f1-5)
          if [ -z "$FAILED_STEP" ]; then
            FAILED_STEP="Build and Push Docker Image"
          fi
          echo "FAILED_STEP=$FAILED_STEP" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - name: Notify Docker failure
        if: failure()
        run: |
          chmod +x scripts/send-telegram-notification.sh
          scripts/send-telegram-notification.sh \
            --type docker_failure \
            --version "${{ steps.version.outputs.VERSION }}" \
            --branch "${{ github.ref_name }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --step "${{ steps.error_details.outputs.FAILED_STEP || 'Build and Push Docker Image' }}" \
            --error "${{ steps.error_details.outputs.ERROR_MSG || 'Check logs for details' }}"
        env:
          APPRISE_URL: ${{ secrets.APPRISE_URL }}

  deploy:
    name: Deploy to k8s
    runs-on: [self-hosted, k8s]
    steps:
      - name: Restart deployment
        run: |
          RESTART_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          curl -sf -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/strategic-merge-patch+json" \
            --cacert "$CA" \
            "https://kubernetes.default.svc/apis/apps/v1/namespaces/guidr/deployments/guidr-api-server" \
            -d "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$RESTART_AT\"}}}}}"
