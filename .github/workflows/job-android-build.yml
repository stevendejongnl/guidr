name: Android Build Job

on:
  workflow_call:
    secrets:
      SENTRY_AUTH_TOKEN:
        required: true

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Create Sentry properties file
        run: |
          cat > android/sentry.properties <<EOF
          auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}
          defaults.org=madebysteven
          defaults.project=guidr
          defaults.url=https://sentry.io/
          EOF

          echo "✅ Created Android Sentry properties file"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          android/gradlew assembleDebug --no-daemon --stacktrace -p android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
